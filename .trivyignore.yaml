# Exceções do Trivy na varredura de `infra/` (caminhos relativos a essa pasta). Toda exceção precisa de justificativa.
misconfigurations:
  - id: DS-0002
    paths:
      - 'docker/ui-visual.Dockerfile'
    statement: >-
      Imagem só dos testes visuais e do E2E (Playwright), nunca publicada nem implantada. Roda como
      root para gravar capturas e relatórios no checkout montado, cujo dono no runner do CI não é o
      usuário node da imagem.
  - id: DS-0026
    paths:
      - 'docker/ui-visual.Dockerfile'
    statement: >-
      Container efêmero que executa uma bateria de testes e termina; não há serviço para checar saúde.
  - id: AWS-0132
    paths:
      - 'terraform/modulos/plataforma/main.tf'
    statement: >-
      Bucket de logs de acesso do S3: o serviço de server access logging só entrega logs em buckets
      com SSE-S3 (AES256); SSE-KMS não é suportado como destino.
  - id: DS-0002
    paths:
      - 'docker/postgres/Dockerfile'
    statement: >-
      Imagem de desenvolvimento local baseada na oficial do PostgreSQL: o entrypoint troca para o
      usuário postgres (gosu) antes de iniciar o banco. Não é usada em produção (RDS).
