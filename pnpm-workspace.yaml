packages:
  - apps/*
  - modules/*
  - packages/*
  - packages/adapters/*
allowBuilds:
  unrs-resolver: false
  protobufjs: false # postinstall só confere a versão do Node; não é necessário
  esbuild: false # postinstall só otimiza a localização do binário, que já vem da dependência opcional da plataforma
  prisma: false # postinstall só antecipa o download do motor de migração, que o CLI baixa sob demanda (com checksum)
  '@prisma/engines': false # idem: o motor é baixado sob demanda pelo CLI
  cpu-features: false # otimização nativa opcional do ssh2 (Testcontainers); não usada
  ssh2: false # idem: compilação nativa opcional
  msgpackr-extract: false # aceleração nativa opcional do msgpackr (BullMQ); funciona em JavaScript puro
savePrefix: ''
# Segurança da cadeia de suprimentos
# Só instala versões publicadas há pelo menos 24 h. Meta: 10080 (7 dias, igual ao cooldown do
# Dependabot) a partir de 2026-10-10, quando as versões fixadas na HU01 completam 7 dias.
minimumReleaseAge: 1440 # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
trustPolicy: no-downgrade # recusa versão com nível de confiança menor que o já instalado
blockExoticSubdeps: true # subdependências só do registro, nunca de git ou URL
# Correções de segurança em dependências de terceiros (pnpm audit), restritas ao caminho afetado.
# Revisar a cada atualização do Prisma: remover quando ele já trouxer as versões corrigidas.
overrides:
  '@prisma/config>deepmerge-ts': 8.0.2 # GHSA-ggr8-5vv4-36mx (estouro de pilha com objetos recursivos)
  'prisma>mysql2': 3.24.5 # GHSA-3f6p-5ww8-9rcr (só usado pelo Prisma em MySQL; o PrejuZero usa PostgreSQL)
