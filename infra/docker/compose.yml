# Ambiente local do PrejuZero (HU02, ADR-010). Uso: `pnpm infra:up` / `pnpm infra:down`.
# Todas as portas ficam presas a 127.0.0.1. Credenciais abaixo são apenas para desenvolvimento local.
name: prejuzero

services:
  postgres:
    build: ./postgres
    image: prejuzero/postgres-dev:16.15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pz_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pz_dev_local}
      POSTGRES_DB: ${POSTGRES_DB:-prejuzero}
      TZ: UTC
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-dados:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:8.6.7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-dados:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Armazenamento S3-compatível local (ADR-017).
  armazenamento:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-pz_dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-pz_dev_local_secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '127.0.0.1:${S3_PORT:-9000}:9000'
      - '127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - armazenamento-dados:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/health || exit 1']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Cria os buckets (idempotente). O bucket de auditoria usa object lock (WORM, ADR-006).
  # Roda sob demanda depois que tudo está saudável: `pnpm infra:up` já executa.
  armazenamento-init:
    image: amazon/aws-cli:2.37.9
    profiles: ['init']
    depends_on:
      armazenamento:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pz_dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pz_dev_local_secret}
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ['/bin/sh', '/scripts/criar-buckets.sh']
    volumes:
      - ./armazenamento/criar-buckets.sh:/scripts/criar-buckets.sh:ro
    restart: 'no'

  mailpit:
    image: axllent/mailpit:v1.31.4
    ports:
      - '127.0.0.1:${SMTP_PORT:-1025}:1025'
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Apps em container (perfil apps, HU04): as mesmas imagens de staging e produção.
  # Suba com `pnpm infra:up:apps`. Para desenvolver com recarga automática, use `pnpm dev`.
  api:
    profiles: ['apps']
    build: &app-build
      context: ../..
      dockerfile: infra/docker/node-app.Dockerfile
      args:
        APP: '@pz/api'
        PORTA: '3000'
        VERSAO: local
    image: prejuzero/api:local
    environment: &app-ambiente
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # A aplicação conecta como pz_app (sem BYPASSRLS, ADR-003).
      DATABASE_URL: postgresql://pz_app:pz_app_local@postgres:5432/${POSTGRES_DB:-prejuzero}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://armazenamento:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-pz_dev}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-pz_dev_local_secret}
      S3_FORCE_PATH_STYLE: 'true'
      # Cifragem de segredos da aplicação (ex.: 2FA): gere com `openssl rand -base64 32` no .env.
      # Vazia: só a api recusa subir (validação do ambiente); a infraestrutura sobe sem ela.
      CHAVE_CIFRAGEM: ${CHAVE_CIFRAGEM:-}
      # E-mail local pelo Mailpit (sem TLS); em produção, relay SMTP com STARTTLS (HU72).
      SMTP_HOST: mailpit
      SMTP_PORT: '1025'
      SMTP_EXIGIR_TLS: 'false'
      PORTAL_URL: ${PORTAL_URL:-http://localhost:3001}
      # Com o perfil observability no ar: APPS_OTEL_ENDPOINT=http://observabilidade:4318 no .env.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${APPS_OTEL_ENDPOINT:-}
    ports:
      - '127.0.0.1:${API_PORT:-3000}:3000'
    depends_on: &app-dependencias
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      armazenamento:
        condition: service_healthy
    restart: unless-stopped

  worker:
    profiles: ['apps']
    build:
      <<: *app-build
      args:
        APP: '@pz/worker'
        PORTA: '3002'
        VERSAO: local
    image: prejuzero/worker:local
    environment:
      <<: *app-ambiente
      # Só o worker recebe o papel com BYPASSRLS (relay do outbox e jobs globais); a api não.
      DATABASE_URL_SISTEMA: postgresql://pz_sistema:pz_sistema_local@postgres:5432/${POSTGRES_DB:-prejuzero}
    ports:
      - '127.0.0.1:${WORKER_PORT:-3002}:3002'
    depends_on: *app-dependencias
    restart: unless-stopped

  # Portal (HU23): imagem standalone do Next.js; /v1 encaminhado à api pela rede do compose.
  web:
    profiles: ['apps']
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        VERSAO: local
    image: prejuzero/web:local
    environment:
      API_URL: http://api:3000
    ports:
      # 3003 no host: a 3001 fica com o `pnpm dev` do portal e com o Grafana (perfil observability).
      - '127.0.0.1:${WEB_PORT:-3003}:3001'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Observabilidade local (opcional): Grafana + Tempo + Loki + Prometheus + coletor OTel em um contêiner.
  # Suba com `pnpm infra:up:obs`. Grafana em http://127.0.0.1:3001
  observabilidade:
    image: grafana/otel-lgtm:0.35.0
    profiles: ['observability']
    ports:
      - '127.0.0.1:${GRAFANA_PORT:-3001}:3000'
      - '127.0.0.1:${OTLP_GRPC_PORT:-4317}:4317'
      - '127.0.0.1:${OTLP_HTTP_PORT:-4318}:4318'
    environment:
      # Alertas por e-mail (HU03): localmente chegam ao Mailpit (http://127.0.0.1:8025).
      ALERTAS_EMAIL: ${ALERTAS_EMAIL:-prejuzero@gmail.com}
      # Sem webhook no .env, o Discord aponta para um endereço local inexistente: a falha de envio
      # aparece no Grafana e o e-mail continua chegando normalmente.
      ALERTAS_DISCORD_WEBHOOK_URL: ${ALERTAS_DISCORD_WEBHOOK_URL:-http://127.0.0.1:9/discord-nao-configurado}
      GF_SMTP_ENABLED: 'true'
      GF_SMTP_HOST: mailpit:1025
      GF_SMTP_STARTTLS_POLICY: NoStartTLS
      GF_SMTP_FROM_ADDRESS: alertas@prejuzero.local
      GF_SMTP_FROM_NAME: PrejuZero alertas
    volumes:
      # Dashboards e alertas como código (HU03): mudanças aqui valem no próximo `pnpm infra:up:obs`.
      - ./observabilidade/dashboards:/otel-lgtm/prejuzero/dashboards:ro
      - ./observabilidade/provisionamento/dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/prejuzero.yaml:ro
      - ./observabilidade/provisionamento/alertas.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/prejuzero.yaml:ro
    depends_on:
      mailpit:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-dados:
  redis-dados:
  armazenamento-dados:
