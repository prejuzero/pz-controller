# Alertas iniciais do PrejuZero (HU03, ADR-011). Cada alerta aponta para o runbook.
# Canais: e-mail (ALERTAS_EMAIL; localmente chega ao Mailpit em http://127.0.0.1:8025) e
# Discord (ALERTAS_DISCORD_WEBHOOK_URL, segredo: só no .env, nunca no repositório).
apiVersion: 1

contactPoints:
  - orgId: 1
    name: equipe-prejuzero
    receivers:
      - uid: pz-email
        type: email
        settings:
          addresses: $ALERTAS_EMAIL
          singleEmail: true
      - uid: pz-discord
        type: discord
        settings:
          url: $ALERTAS_DISCORD_WEBHOOK_URL
          use_discord_username: false

policies:
  - orgId: 1
    receiver: equipe-prejuzero
    group_by: ['alertname']
    group_wait: 10s
    group_interval: 1m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: prejuzero
    folder: PrejuZero
    interval: 30s
    rules:
      - uid: pz-api-5xx
        title: 'API com mais de 1% de erros 5xx'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '100 * sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 1e-9)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [1] } }]
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severidade: critica }
        annotations:
          summary: 'Mais de 1% das requisições terminaram em 5xx nos últimos 5 minutos.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#api-5xx'
      - uid: pz-fila-parada
        title: 'Fila sem progresso há mais de 15 minutos'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (fila) (pz_fila_idade_mais_antigo_seconds)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [900] } }]
        for: 1m
        noDataState: OK
        execErrState: Error
        labels: { severidade: critica }
        annotations:
          summary: 'O job mais antigo da fila {{ $labels.fila }} aguarda há mais de 15 minutos.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#fila-parada'
      - uid: pz-fila-dlq
        title: 'Fila com jobs na DLQ'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (fila) (pz_fila_dlq)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: critica }
        annotations:
          summary: 'Há jobs na DLQ da fila {{ $labels.fila }}: falharam após todas as retentativas.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#fila-dlq'
      - uid: pz-auditoria-divergente
        title: 'Trilha de auditoria divergente'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(increase(pz_auditoria_divergencias_total[24h]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: critica }
        annotations:
          summary: 'A verificação diária encontrou adulteração ou registros apagados na trilha de auditoria.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#auditoria-divergente'
      - uid: pz-integracao-degradada
        title: 'Adaptador de integração degradado'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (adaptador) (pz_integracao_circuito_estado)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [1] } }]
        for: 1m
        noDataState: OK
        execErrState: Error
        labels: { severidade: alta }
        annotations:
          summary: 'O circuit breaker do adaptador {{ $labels.adaptador }} está aberto.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#integracao-degradada'
      - uid: pz-captura-fonte-degradada
        title: 'Fonte de publicações degradada'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'max by (fonte) (pz_captura_fonte_degradada)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: critica }
        annotations:
          summary: 'A fonte {{ $labels.fonte }} falhou seguidamente: a captura está parada e os escritórios foram avisados.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#captura-fonte-degradada'
      - uid: pz-captura-alvo-falhando
        title: 'Alvo de captura com falhas seguidas'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(increase(pz_captura_alvo_falhando_total[1h]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: alta }
        annotations:
          summary: 'Uma OAB ou processo falhou na captura várias vezes seguidas (veja o log captura.alvo-falhando).'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#captura-alvo-falhando'
      - uid: pz-email-rejeicao
        title: 'Rejeição de e-mail'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum by (motivo) (increase(pz_email_rejeicoes_total[15m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: alta }
        annotations:
          summary: 'O provedor rejeitou e-mails ({{ $labels.motivo }}) nos últimos 15 minutos.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#email-rejeicao'
      - uid: pz-ia-orcamento
        title: 'Orçamento de IA acima de 80%'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum by (tarefa) (increase(pz_ia_orcamento_alertas_total[1h]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: media }
        annotations:
          summary: 'A tarefa de IA {{ $labels.tarefa }} passou de 80% do orçamento mensal de algum escritório.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#ia-orcamento'
      - uid: pz-ia-orcamento-diario
        title: 'Custo diário de IA acima do orçamento'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(increase(pz_ia_orcamento_diario_excedido_total[1h]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: media }
        annotations:
          summary: 'O custo estimado de IA da plataforma passou do orçamento diário (IA_ORCAMENTO_DIARIO_USD).'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#ia-orcamento-diario'
      - uid: pz-ia-saidas-invalidas
        title: 'Salto em saídas inválidas da IA'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum by (tarefa) (increase(pz_ia_chamada_duracao_seconds_count{resultado="saida-invalida"}[30m])) / clamp_min(sum by (tarefa) (increase(pz_ia_chamada_duracao_seconds_count[30m])), 20)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0.05] } }]
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severidade: alta }
        annotations:
          summary: 'Mais de 5% das respostas da tarefa {{ $labels.tarefa }} foram recusadas pela validação.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#ia-saidas-invalidas'
      - uid: pz-ia-provedor-indisponivel
        title: 'IA sem modelo disponível'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum by (tarefa) (increase(pz_ia_tarefas_sem_modelo_total[15m]))'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions: [{ evaluator: { type: gt, params: [0] } }]
        for: 0s
        noDataState: OK
        execErrState: Error
        labels: { severidade: critica }
        annotations:
          summary: 'Todos os modelos da tarefa {{ $labels.tarefa }} falharam (indisponível ou sem cota).'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#ia-provedor-indisponivel'

  # SLOs como código (HU40, PZ-232; SLOs da página Padrões de engenharia). Burn rate em duas
  # janelas (longa e curta): alerta só quando o orçamento de erro do mês está sendo gasto rápido
  # e o problema ainda acontece agora. Orçamento = 1 - objetivo (0,5% de 5xx; 5% acima do limite).
  - orgId: 1
    name: prejuzero-slos
    folder: PrejuZero
    interval: 1m
    rules:
      - uid: pz-slo-disponibilidade-rapido
        title: 'SLO · Disponibilidade da API (99,5%): queima rápida'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[1h])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[1h])), 1e-9)'
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[5m])), 1e-9)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: '$A > 0.072 && $B > 0.072'
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severidade: critica, slo: disponibilidade }
        annotations:
          summary: 'Fração de requisições com 5xx acima de 0.072 em 1h e 5m (14.4x o orçamento): consome 2% do orçamento mensal em 1 hora.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#slo-disponibilidade'
      - uid: pz-slo-disponibilidade-lento
        title: 'SLO · Disponibilidade da API (99,5%): queima lenta'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[6h])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[6h])), 1e-9)'
          - refId: B
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              instant: true
              expr: 'sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[30m])) / clamp_min(sum(rate(http_server_request_duration_seconds_count[30m])), 1e-9)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: '$A > 0.03 && $B > 0.03'
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severidade: alta, slo: disponibilidade }
        annotations:
          summary: 'Fração de requisições com 5xx acima de 0.03 em 6h e 30m (6x o orçamento): consome 5% do orçamento mensal em 6 horas.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#slo-disponibilidade'
      - uid: pz-slo-latencia-leitura-rapido
        title: 'SLO · Latência de leitura da API (p95 < 300 ms): queima rápida'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"GET|HEAD"}[1h])) - sum(rate(http_server_request_duration_seconds_bucket{http_request_method=~"GET|HEAD",le="0.3"}[1h]))) / clamp_min(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"GET|HEAD"}[1h])), 1e-9)'
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              instant: true
              expr: '(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"GET|HEAD"}[5m])) - sum(rate(http_server_request_duration_seconds_bucket{http_request_method=~"GET|HEAD",le="0.3"}[5m]))) / clamp_min(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"GET|HEAD"}[5m])), 1e-9)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: '$A > 0.72 && $B > 0.72'
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severidade: critica, slo: latencia-leitura }
        annotations:
          summary: 'Fração de leituras acima de 300 ms acima de 0.72 em 1h e 5m (14.4x o orçamento): consome 2% do orçamento mensal em 1 hora.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#slo-latencia-leitura'
      - uid: pz-slo-latencia-leitura-lento
        title: 'SLO · Latência de leitura da API (p95 < 300 ms): queima lenta'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"GET|HEAD"}[6h])) - sum(rate(http_server_request_duration_seconds_bucket{http_request_method=~"GET|HEAD",le="0.3"}[6h]))) / clamp_min(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"GET|HEAD"}[6h])), 1e-9)'
          - refId: B
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              instant: true
              expr: '(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"GET|HEAD"}[30m])) - sum(rate(http_server_request_duration_seconds_bucket{http_request_method=~"GET|HEAD",le="0.3"}[30m]))) / clamp_min(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"GET|HEAD"}[30m])), 1e-9)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: '$A > 0.3 && $B > 0.3'
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severidade: alta, slo: latencia-leitura }
        annotations:
          summary: 'Fração de leituras acima de 300 ms acima de 0.3 em 6h e 30m (6x o orçamento): consome 5% do orçamento mensal em 6 horas.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#slo-latencia-leitura'
      - uid: pz-slo-latencia-escrita-rapido
        title: 'SLO · Latência de escrita da API (p95 < 800 ms): queima rápida'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"POST|PUT|PATCH|DELETE"}[1h])) - sum(rate(http_server_request_duration_seconds_bucket{http_request_method=~"POST|PUT|PATCH|DELETE",le="0.8"}[1h]))) / clamp_min(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"POST|PUT|PATCH|DELETE"}[1h])), 1e-9)'
          - refId: B
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              instant: true
              expr: '(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"POST|PUT|PATCH|DELETE"}[5m])) - sum(rate(http_server_request_duration_seconds_bucket{http_request_method=~"POST|PUT|PATCH|DELETE",le="0.8"}[5m]))) / clamp_min(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"POST|PUT|PATCH|DELETE"}[5m])), 1e-9)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: '$A > 0.72 && $B > 0.72'
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severidade: critica, slo: latencia-escrita }
        annotations:
          summary: 'Fração de escritas acima de 800 ms acima de 0.72 em 1h e 5m (14.4x o orçamento): consome 2% do orçamento mensal em 1 hora.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#slo-latencia-escrita'
      - uid: pz-slo-latencia-escrita-lento
        title: 'SLO · Latência de escrita da API (p95 < 800 ms): queima lenta'
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: '(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"POST|PUT|PATCH|DELETE"}[6h])) - sum(rate(http_server_request_duration_seconds_bucket{http_request_method=~"POST|PUT|PATCH|DELETE",le="0.8"}[6h]))) / clamp_min(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"POST|PUT|PATCH|DELETE"}[6h])), 1e-9)'
          - refId: B
            relativeTimeRange: { from: 21600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: B
              instant: true
              expr: '(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"POST|PUT|PATCH|DELETE"}[30m])) - sum(rate(http_server_request_duration_seconds_bucket{http_request_method=~"POST|PUT|PATCH|DELETE",le="0.8"}[30m]))) / clamp_min(sum(rate(http_server_request_duration_seconds_count{http_request_method=~"POST|PUT|PATCH|DELETE"}[30m])), 1e-9)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: math
              expression: '$A > 0.3 && $B > 0.3'
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severidade: alta, slo: latencia-escrita }
        annotations:
          summary: 'Fração de escritas acima de 800 ms acima de 0.3 em 6h e 30m (6x o orçamento): consome 5% do orçamento mensal em 6 horas.'
          runbook_url: 'https://github.com/prejuzero/pz-controller/blob/main/docs/runbooks/alertas.md#slo-latencia-escrita'
