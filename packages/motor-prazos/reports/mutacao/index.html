ramo > trabalhista e juizado cível citam o próprio fundamento","location":{"start":{"column":3,"line":349}}},{"id":"32","name":"RN02 · suspensão de 20/12 a 20/01 por ramo > penal sem a informação das exceções: sugere sem suspensão e mostra a data com suspensão (V2, C03)","location":{"start":{"column":3,"line":358}}},{"id":"33","name":"RN02 · suspensão de 20/12 a 20/01 por ramo > penal com exceção informada não suspende; sem exceção, suspende","location":{"start":{"column":3,"line":374}}},{"id":"34","name":"RN02 · suspensão de 20/12 a 20/01 por ramo > penal antes da Lei 14.365/2022 (vigência em 03/06/2022) não suspende","location":{"start":{"column":3,"line":387}}},{"id":"35","name":"RN04 · intimação pelo portal (Lei 11.419/2006, art. 5º; V2, C04) > consulta antes dos 10 dias: ciência na consulta e início no dia útil seguinte","location":{"start":{"column":3,"line":402}}},{"id":"36","name":"RN04 · intimação pelo portal (Lei 11.419/2006, art. 5º; V2, C04) > consulta em dia não útil: ciência no primeiro dia útil seguinte (art. 5º, §2º)","location":{"start":{"column":3,"line":416}}},{"id":"37","name":"RN04 · intimação pelo portal (Lei 11.419/2006, art. 5º; V2, C04) > sem consulta: ciência tácita no 10º dia corrido contado do dia seguinte ao envio","location":{"start":{"column":3,"line":423}}},{"id":"38","name":"RN04 · intimação pelo portal (Lei 11.419/2006, art. 5º; V2, C04) > 10º dia em dia não útil fica a confirmar (regra pendente com a curadoria)","location":{"start":{"column":3,"line":429}}},{"id":"39","name":"RN04 · intimação pelo portal (Lei 11.419/2006, art. 5º; V2, C04) > consulta anterior ao envio é dado inválido","location":{"start":{"column":3,"line":434}}},{"id":"40","name":"RN04 · intimação pelo portal (Lei 11.419/2006, art. 5º; V2, C04) > processo penal pelo portal não tem regra cadastrada","location":{"start":{"column":3,"line":439}}},{"id":"41","name":"ciência informada pelo advogado (meio manual) > cível: início no primeiro dia útil seguinte à ciência","location":{"start":{"column":3,"line":446}}},{"id":"42","name":"ciência informada pelo advogado (meio manual) > penal: exclui só o dia do começo, em dias corridos (CPP, art. 798, §1º)","location":{"start":{"column":3,"line":455}}},{"id":"43","name":"RN06 · prazo em dobro conforme a tabela > entes do CPC: fazenda-publica dobra","location":{"start":{"column":14,"line":474}}},{"id":"44","name":"RN06 · prazo em dobro conforme a tabela > entes do CPC: ministerio-publico dobra","location":{"start":{"column":14,"line":474}}},{"id":"45","name":"RN06 · prazo em dobro conforme a tabela > entes do CPC: defensoria dobra","location":{"start":{"column":14,"line":474}}},{"id":"46","name":"RN06 · prazo em dobro conforme a tabela > litisconsortes com procuradores distintos só dobram em autos físicos (CPC, art. 229, §2º)","location":{"start":{"column":3,"line":480}}},{"id":"47","name":"RN06 · prazo em dobro conforme a tabela > prazo próprio do ente não dobra","location":{"start":{"column":3,"line":486}}},{"id":"48","name":"RN06 · prazo em dobro conforme a tabela > penal: só a Defensoria dobra (LC 80/1994)","location":{"start":{"column":3,"line":494}}},{"id":"49","name":"RN06 · prazo em dobro conforme a tabela > trabalhista: Fazenda dobra para recorrer; os demais entes não","location":{"start":{"column":3,"line":504}}},{"id":"50","name":"RN06 · prazo em dobro conforme a tabela > \"verificar caso a caso\": sugere o simples e mostra o dobro como alternativa","location":{"start":{"column":3,"line":518}}},{"id":"51","name":"propriedades > a data sugerida nunca é mais tardia que uma alternativa","location":{"start":{"column":3,"line":534}}},{"id":"52","name":"propriedades > cível: o vencimento cai em dia útil e depois da publicação","location":{"start":{"column":3,"line":551}}},{"id":"53","name":"casos de borda (achados pelo teste de mutação) > texto do aviso de feriado local é o aprovado pela curadoria (V2, aba 8)","location":{"start":{"column":3,"line":563}}},{"id":"54","name":"casos de borda (achados pelo teste de mutação) > autos físicos sem litisconsortes com procuradores distintos não dobram","location":{"start":{"column":3,"line":572}}},{"id":"55","name":"casos de borda (achados pelo teste de mutação) > dobro decidido pela tabela não gera alternativa","location":{"start":{"column":3,"line":578}}},{"id":"56","name":"casos de borda (achados pelo teste de mutação) > a alternativa do dobro cita o fundamento","location":{"start":{"column":3,"line":588}}},{"id":"57","name":"casos de borda (achados pelo teste de mutação) > prorrogação no cível não gera alternativa","location":{"start":{"column":3,"line":599}}},{"id":"58","name":"casos de borda (achados pelo teste de mutação) > penal no DJEN cita a Lei 11.419/2006","location":{"start":{"column":3,"line":604}}},{"id":"59","name":"casos de borda (achados pelo teste de mutação) > feriado ou suspensão no dia do início adia o início (cível e penal)","location":{"start":{"column":3,"line":608}}},{"id":"60","name":"casos de borda (achados pelo teste de mutação) > ciência manual no cível: indisponibilidade no dia seguinte adia o início","location":{"start":{"column":3,"line":616}}},{"id":"61","name":"casos de borda (achados pelo teste de mutação) > penal: sábado que também é feriado prorroga sem alternativa (CPP, art. 798, §3º)","location":{"start":{"column":3,"line":623}}},{"id":"62","name":"casos de borda (achados pelo teste de mutação) > penal: feriado no vencimento cita o CPP, não a Lei 11.419/2006","location":{"start":{"column":3,"line":637}}},{"id":"63","name":"casos de borda (achados pelo teste de mutação) > penal com vencimento exatamente em 20/12 mostra a alternativa com a suspensão","location":{"start":{"column":3,"line":650}}},{"id":"64","name":"casos de borda (achados pelo teste de mutação) > a suspensão de fim de ano aparece na memória com o motivo","location":{"start":{"column":3,"line":656}}},{"id":"65","name":"casos de borda (achados pelo teste de mutação) > portal: dias até a ciência entram na memória","location":{"start":{"column":3,"line":663}}},{"id":"66","name":"casos de borda (achados pelo teste de mutação) > \"a confirmar\" traz o detalhe e os fundamentos","location":{"start":{"column":3,"line":673}}}],"source":"import { LocalDate } from '@pz/kernel';\nimport fc from 'fast-check';\nimport { describe, expect, it } from 'vitest';\n\nimport { calendarioDeOcorrencias, type Efeito, type OcorrenciaDatada } from './calendario.js';\nimport {\n  AVISO_ALTERNATIVAS,\n  AVISO_FERIADO_LOCAL,\n  calcularPrazo,\n  VERSAO_DO_MOTOR,\n} from './regras.js';\n\nimport type { EntradaDoCalculo, PrazoDaTabela, ResultadoDoCalculo } from './modelo.js';\n\n// Calendários FICTÍCIOS: testam a ordem e o efeito das regras, não o calendário real. Os casos\n// com datas reais e assinados pela curadora entram na suíte do motor (PZ-135).\n// Referência: 01/03/2027 é uma segunda-feira.\nconst d = (iso: string) => {\n  const r = LocalDate.analisar(iso);\n  if (!r.ok) throw r.erro;\n  return r.valor;\n};\nconst evento =\n  (efeito: Efeito, motivo: string) =>\n  (iso: string): OcorrenciaDatada => ({\n    data: d(iso),\n    efeito,\n    motivo,\n    atoNormativo: `Ato fictício (${motivo})`,\n    urlAto: 'https://exemplo.invalid/ato',\n  });\nconst feriado = evento('sem-expediente', 'feriado fictício');\nconst suspensao = evento('suspensao-de-prazos', 'suspensão fictícia');\nconst indisponibilidade = evento('indisponibilidade', 'indisponibilidade fictícia');\n\nconst prazo = (extra: Partial<"+"PrazoDaTabela> = {}): PrazoDaTabela => ({\n  quantidade: 15,\n  unidade: 'dias',\n  contagem: 'uteis',\n  fundamento: 'CPC, art. 335',\n  versao: 'tabela-teste-1',\n  dobro: 'entes-cpc',\n  ...extra,\n});\nconst entrada = (extra: Partial<"+"EntradaDoCalculo> = {}): EntradaDoCalculo => ({\n  ramo: 'civel',\n  meio: 'djen',\n  dataDeReferencia: d('2027-03-01'),\n  prazo: prazo(),\n  condicoes: {},\n  fusoDoJuizo: 'America/Sao_Paulo',\n  calendario: calendarioDeOcorrencias([]),\n  ...extra,\n});\nconst penal = (extra: Partial<"+"EntradaDoCalculo> = {}) =>\n  entrada({\n    ramo: 'penal',\n    prazo: prazo({ quantidade: 5, contagem: 'corridos', dobro: 'so-defensoria' }),\n    ...extra,\n  });\n\ntype Calculado = Extract<"+"ResultadoDoCalculo, { situacao: 'calculado' }>;\nconst calculado = (e: EntradaDoCalculo): Calculado => {\n  const r = calcularPrazo(e);\n  if (r.situacao !== 'calculado') throw new Error(`esperava calculado: ${r.detalhe}`);\n  return r;\n};\nconst iso = (data: LocalDate | undefined) => data?.paraIso();\nconst resumo = (e: EntradaDoCalculo) => {\n  const r = calculado(e);\n  return {\n    publicacao: iso(r.publicacao),\n    ciencia: iso(r.ciencia),\n    inicio: iso(r.inicio),\n    vencimento: iso(r.vencimento),\n  };\n};\nconst desconsiderados = (r: Calculado) =>\n  r.diasDesconsiderados.map((dia) => `${dia.data.paraIso()} ${dia.motivo}`);\n\ndescribe('casos sem cálculo automático (CLAUDE.md, seção 4.4)', () => {\n  it('sem regra legal cadastrada para o ato', () => {\n    const { prazo: comPrazo, ...semPrazo } = entrada();\n    expect(comPrazo).toBeDefined();\n    expect(calcularPrazo(semPrazo)).toEqual({\n      situacao: 'a-confirmar',\n      motivo: 'sem-regra-legal',\n      detalhe: 'sem regra legal cadastrada para este ato',\n      fundamentos: [],\n    });\n  });\n\n  it.each(['horas', 'meses', 'anos'] as const)(\n    'prazo em %s fica a confirmar (V2, Q14 e Q15)',\n    (u) => {\n      const r = calcularPrazo(entrada({ prazo: prazo({ unidade: u }) }));\n      expect(r).toMatchObject({ situacao: 'a-confirmar', motivo: 'unidade-sem-regra' });\n    },\n  );\n\n  it('contagem da tabela diferente da regra do ramo não é calculada', () => {\n    const r = calcularPrazo(entrada({ prazo: prazo({ contagem: 'corridos' }) }));\n    expect(r).toMatchObject({ situacao: 'a-confirmar', motivo: 'dados-insuficientes' });\n  });\n\n  it('prazo iniciado antes da vigência da regra fica a confirmar (CPC, art. 14)', () => {\n    const civel = calcularPrazo(entrada({ dataDeReferencia: d('2016-03-14') }));\n    expect(civel).toMatchObject({ situacao: 'a-confirmar', motivo: 'sem-regra-legal' });\n    // Lei 13.728/2018: o art. 12-A da Lei 9.099/1995 vale a partir de 01/11/2018 (V2, aba 3).\n    const juizado = calcularPrazo(\n      entrada({\n        ramo: 'juizados',\n        dataDeReferencia: d('2018-10-26'),\n        prazo: prazo({ quantidade: 10 }),\n      }),\n    );\n    expect(juizado).toMatchObject({ situacao: 'a-confirmar', motivo: 'sem-regra-legal' });\n    expect(\n      calculado(entrada({ ramo: 'juizados', dataDeReferencia: d('2018-11-05') })).fundamentos,\n    ).toContain('Lei 9.099/1995, art. 12-A');\n  });\n\n  it('calendário que nunca deixa contar vira \"a confirmar\"', () => {\n    const tudoSuspenso = {\n      ocorrencias: () => [suspensao('2027-03-01')],\n      feriadosLocaisVerificados: true,\n    };\n    const r = calcularPrazo(entrada({ calendario: tudoSuspenso }));\n    expect(r).toMatchObject({ situacao: 'a-confirmar', motivo: 'calendario-esgotado' });\n  });\n\n  // Calendário (cadastro errado) que fecha tudo a partir de uma data: cada etapa vira \"a confirmar\".\n  const aPartirDe = (inicio: string, gerar: (iso: string) => OcorrenciaDatada) => ({\n    ocorrencias: (data: LocalDate) => (data.ehAntesDe(d(inicio)) ? [] : [gerar(data.paraIso())]),\n    feriadosLocaisVerificados: true,\n  });\n  it.each([\n    ['publicação (DJEN)', entrada({ calendario: aPartirDe('2027-03-02', feriado) })],\n    [\n      'ciência na consulta (portal)',\n      entrada({\n        meio: 'portal',\n        dataDaConsulta: d('2027-03-03'),\n        calendario: aPartirDe('2027-03-03', feriado),\n      }),\n    ],\n    [\n      'início depois da consulta (portal)',\n      entrada({\n        meio: 'portal',\n        dataDaConsulta: d('2027-03-03'),\n        calendario: aPartirDe('2027-03-04', feriado),\n      }),\n    ],\n    [\n      'início (manual, cível)',\n      entrada({ meio: 'manual', calendario: aPartirDe('2027-03-02', feriado) }),\n    ],\n    [\n      'início (manual, penal)',\n      penal({ meio: 'manual', calendario: aPartirDe('2027-03-02', suspensao) }),\n    ],\n    ['contagem', entrada({ calendario: aPartirDe('2027-03-04', suspensao) })],\n    ['prorrogação (cível)', entrada({ calendario: aPartirDe('2027-03-23', indisponibilidade) })],\n    ['prorrogação (penal)', penal({ calendario: aPartirDe('2027-03-07', indisponibilidade) })],\n    [\n      'alternativa com a suspensão penal',\n      penal({\n        dataDeReferencia: d('2027-12-14'),\n        prazo: prazo({ quantidade: 9, contagem: 'corridos', dobro: 'so-defensoria' }),\n        calendario: aPartirDe('2028-01-21', suspensao),\n      }),\n    ],\n  ])('%s', (_etapa, e) => {\n    expect(calcularPrazo(e)).toMatchObject({\n      situacao: 'a-confirmar',\n      motivo: 'calendario-esgotado',\n    });\n  });\n});\n\ndescribe('RN03 · DJEN: publicação e início (Lei 11.419/2006, art. 4º, §§3º e 4º)', () => {\n  it('cível, 15 dias úteis, sem feriado', () => {\n    const r = calculado(entrada());\n    expect(resumo(entrada())).toEqual({\n      publicacao: '2027-03-02',\n      ciencia: undefined,\n      inicio: '2027-03-03',\n      vencimento: '2027-03-23',\n    });\n    expect(r.fundamentos).toEqual([\n      'Lei 11.419/2006, art. 4º, §§3º e 4º',\n      'CPC, art. 224, §§2º e 3º',\n      'CPC, arts. 219 e 224',\n      'CPC, art. 335',\n    ]);\n    expect(r.alternativas).toEqual([]);\n    expect(r.versaoDoMotor).toBe(VERSAO_DO_MOTOR);\n    expect(r.versaoDaTabela).toBe('tabela-teste-1');\n  });\n\n  it('disponibilização na sexta: publicação e início na semana seguinte', () => {\n    const e = entrada({ dataDeReferencia: d('2027-03-05') });\n    expect(resumo(e)).toMatchObject({ publicacao: '2027-03-08', inicio: '2027-03-09' });\n    expect(desconsiderados(calculado(e)).slice(0, 2)).toEqual([\n      '2027-03-06 sábado',\n      '2027-03-07 domingo',\n    ]);\n  });\n\n  it('feriado no dia seguinte à disponibilização adia a publicação', () => {\n    const e = entrada({ calendario: calendarioDeOcorrencias([feriado('2027-03-02')]) });\n    expect(resumo(e)).toMatchObject({ publicacao: '2027-03-03', inicio: '2027-03-04' });\n  });\n\n  it('suspensão de prazos não impede a publicação, só o início (V2, CT07)', () => {\n    const calendario = calendarioDeOcorrencias(\n      ['2027-03-02', '2027-03-03', '2027-03-04', '2027-03-05'].map(suspensao),\n    );\n    expect(resumo(entrada({ calendario }))).toMatchObject({\n      publicacao: '2027-03-02',\n      inicio: '2027-03-08',\n    });\n  });\n});\n\ndescribe('RN01 e RN07 · contagem por ramo', () => {\n  it('cível em dias úteis: feriado e suspensão no meio do prazo não contam', () => {\n    const calendario = calendarioDeOcorrencias([feriado('2027-03-10'), suspensao('2027-03-11')]);\n    const r = calculado(entrada({ calendario }));\n    expect(iso(r.vencimento)).toBe('2027-03-25');\n    expect(desconsiderados(r)).toContain('2027-03-10 feriado fictício');\n    expect(desconsiderados(r)).toContain('2027-03-11 suspensão fictícia');\n  });\n\n  it('trabalhista e juizado cível em dias úteis, com o fundamento do ramo', () => {\n    const trabalhista = calculado(\n      entrada({ ramo: 'trabalhista', prazo: prazo({ quantidade: 8 }) }),\n    );\n    expect(iso(trabalhista.vencimento)).toBe('2027-03-12');\n    expect(trabalhista.fundamentos).toContain('CLT, art. 775');\n    const juizado = calculado(entrada({ ramo: 'juizados', prazo: prazo({ quantidade: 10 }) }));\n    expect(iso(juizado.vencimento)).toBe('2027-03-16');\n    expect(juizado.fundamentos).toContain('Lei 9.099/1995, art. 12-A');\n  });\n\n  it('penal em dias corridos: feriado e fim de semana no meio contam (V2, C01)', () => {\n    const calendario = calendarioDeOcorrencias([feriado('2027-03-04')]);\n    const r = calculado(\n      penal({\n        calendario,\n        prazo: prazo({ quantidade: 3, contagem: 'corridos', dobro: 'so-defensoria' }),\n      }),\n    );\n    expect(\n      resumo(\n        penal({\n          calendario,\n          prazo: prazo({ quantidade: 3, contagem: 'corridos', dobro: 'so-defensoria' }),\n        }),\n      ),\n    ).toMatchObject({\n      publicacao: '2027-03-02',\n      inicio: '2027-03-03',\n      vencimento: '2027-03-05',\n    });\n    expect(r.fundamentos).toContain('CPP, art. 798, caput e §1º');\n    expect(r.fundamentos).not.toContain('CPC, art. 224, §§2º e 3º');\n  });\n\n  it('juizado criminal segue a contagem penal (V2, Q17)', () => {\n    const r = calculado(penal({ ramo: 'juizado-criminal' }));\n    expect(iso(r.vencimento)).toBe('2027-03-08');\n    expect(r.fundamentos).toContain('CPP, art. 798, caput e §1º, c/c Lei 9.099/1995, art. 92');\n  });\n});\n\ndescribe('RN08 · prorrogação de início e vencimento', () => {\n  it('indisponibilidade no início adia o início; no meio do prazo não altera (V2, CT10 e CT16)', () => {\n    const noInicio = calendarioDeOcorrencias([indisponibilidade('2027-03-03')]);\n    expect(resumo(entrada({ calendario: noInicio }))).toMatchObject({\n      publicacao: '2027-03-02',\n      inicio: '2027-03-04',\n      vencimento: '2027-03-24',\n    });\n    const noMeio = calendarioDeOcorrencias([indisponibilidade('2027-03-10')]);\n    expect(resumo(entrada({ calendario: noMeio })).vencimento).toBe('2027-03-23');\n  });\n\n  it('indisponibilidade no vencimento prorroga para o próximo dia útil (V2, CT22)', () => {\n    const calendario = calendarioDeOcorrencias([indisponibilidade('2027-03-23')]);\n    const r = calculado(entrada({ calendario }));\n    expect(iso(r.vencimento)).toBe('2027-03-24');\n    expect(r.fundamentos).toContain('CPC, art. 224, §1º; Lei 11.419/2006, art. 10, §2º');\n  });\n\n  it('penal: vencimento no domingo ou feriado prorroga para o dia útil imediato (CPP, art. 798, §3º)', () => {\n    const domingo = calculado(penal());\n    expect(iso(domingo.vencimento)).toBe('2027-03-08');\n    expect(domingo.fundamentos).toContain('CPP, art. 798, §3º');\n    const comFeriado = calendarioDeOcorrencias([feriado('2027-03-08')]);\n    expect(resumo(penal({ calendario: comFeriado })).vencimento).toBe('2027-03-09');\n  });\n\n  it('penal: vencimento no sábado não prorroga; a prorrogação aparece como alternativa (V2, C01)', () => {\n    const r = calculado(\n      penal({ prazo: prazo({ quantidade: 4, contagem: 'corridos', dobro: 'so-defensoria' }) }),\n    );\n    expect(iso(r.vencimento)).toBe('2027-03-06');\n    expect(r.alternativas.map((a) => [iso(a.vencimento), a.descricao])).toEqual([\n      ['2027-03-08', 'prorrogação do vencimento no sábado para o próximo dia útil'],\n    ]);\n  });\n\n  it('penal: indisponibilidade no vencimento prorroga (Lei 11.419/2006, art. 10, §2º)', () => {\n    const calendario = calendarioDeOcorrencias([indisponibilidade('2027-03-05')]);\n    const r = calculado(\n      penal({\n        calendario,\n        prazo: prazo({ quantidade: 3, contagem: 'corridos', dobro: 'so-defensoria' }),\n      }),\n    );\n    expect(iso(r.vencimento)).toBe('2027-03-08');\n    expect(r.fundamentos).toContain('Lei 11.419/2006, art. 10, §2º');\n  });\n});\n\ndescribe('RN02 · suspensão de 20/12 a 20/01 por ramo', () => {\n  it('cível: os dias de 20/12 a 20/01 não contam (CPC, art. 220)', () => {\n    const r = calculado(entrada({ dataDeReferencia: d('2027-12-14') }));\n    expect(resumo(entrada({ dataDeReferencia: d('2027-12-14') }))).toMatchObject({\n      publicacao: '2027-12-15',\n      inicio: '2027-12-16',\n      vencimento: '2028-02-08',\n    });\n    const suspensos = r.diasDesconsiderados.filter((dia) => dia.fundamento === 'CPC, art. 220');\n    expect(iso(suspensos[0]?.data)).toBe('2027-12-20');\n    expect(iso(suspensos.at(-1)?.data)).toBe('2028-01-20');\n    expect(r.fundamentos).toContain('CPC, art. 220');\n  });\n\n  it('disponibilização durante a suspensão: publica e só começa depois de 20/01 (V2, CT07)', () => {\n    expect(resumo(entrada({ dataDeReferencia: d('2028-01-05') }))).toMatchObject({\n      publicacao: '2028-01-06',\n      inicio: '2028-01-21',\n    });\n  });\n\n  it('trabalhista e juizado cível citam o próprio fundamento', () => {\n    const trabalhista = calculado(\n      entrada({ ramo: 'trabalhista', dataDeReferencia: d('2027-12-14') }),\n    );\n    expect(trabalhista.fundamentos).toContain('CLT, art. 775-A');\n    const juizado = calculado(entrada({ ramo: 'juizados', dataDeReferencia: d('2027-12-14') }));\n    expect(juizado.fundamentos).toContain('CPC, art. 220');\n  });\n\n  it('penal sem a informação das exceções: sugere sem suspensão e mostra a data com suspensão (V2, C03)', () => {\n    const e = penal({\n      dataDeReferencia: d('2027-12-14'),\n      prazo: prazo({ quantidade: 9, contagem: 'corridos', dobro: 'so-defensoria' }),\n    });\n    const r = calculado(e);\n    expect(iso(r.vencimento)).toBe('2027-12-24');\n    expect(r.alternativas.map((a) => [iso(a.vencimento), a.descricao])).toEqual([\n      [\n        '2028-01-25',\n        'com a suspensão de 20/12 a 20/01 (processo sem réu preso, Lei Maria da Penha ou medida urgente)',\n      ],\n    ]);\n    expect(r.alternativas[0]?.fundamentos).toEqual(['CPP, art. 798-A']);\n  });\n\n  it('penal com exceção informada não suspende; sem exceção, suspende', () => {\n    const base = {\n      dataDeReferencia: d('2027-12-14'),\n      prazo: prazo({ quantidade: 9, contagem: 'corridos', dobro: 'so-defensoria' as const }),\n    };\n    const comExcecao = calculado(penal({ ...base, condicoes: { excecaoDaSuspensaoPenal: true } }));\n    expect(iso(comExcecao.vencimento)).toBe('2027-12-24');\n    expect(comExcecao.alternativas).toEqual([]);\n    const semExcecao = calculado(penal({ ...base, condicoes: { excecaoDaSuspensaoPenal: false } }));\n    expect(iso(semExcecao.vencimento)).toBe('2028-01-25');\n    expect(semExcecao.fundamentos).toContain('CPP, art. 798-A');\n  });\n\n  it('penal antes da Lei 14.365/2022 (vigência em 03/06/2022) não suspende', () => {\n    const r = calculado(\n      penal({\n        dataDeReferencia: d('2021-12-14'),\n        prazo: prazo({ quantidade: 9, contagem: 'corridos', dobro: 'so-defensoria' }),\n      }),\n    );\n    expect(r.alternativas).toEqual([]);\n    expect(r.fundamentos).not.toContain('CPP, art. 798-A');\n  });\n});\n\ndescribe('RN04 · intimação pelo portal (Lei 11.419/2006, art. 5º; V2, C04)', () => {\n  const portal = (extra: Partial<"+"EntradaDoCalculo> = {}) => entrada({ meio: 'portal', ...extra });\n\n  it('consulta antes dos 10 dias: ciência na consulta e início no dia útil seguinte', () => {\n    const r = calculado(portal({ dataDaConsulta: d('2027-03-03') }));\n    expect(resumo(portal({ dataDaConsulta: d('2027-03-03') }))).toEqual({\n      publicacao: undefined,\n      ciencia: '2027-03-03',\n      inicio: '2027-03-04',\n      vencimento: '2027-03-24',\n    });\n    expect(r.fundamentos.slice(0, 2)).toEqual([\n      'Lei 11.419/2006, art. 5º, §§1º a 3º',\n      'CPC, art. 231, V',\n    ]);\n  });\n\n  it('consulta em dia não útil: ciência no primeiro dia útil seguinte (art. 5º, §2º)', () => {\n    expect(resumo(portal({ dataDaConsulta: d('2027-03-06') }))).toMatchObject({\n      ciencia: '2027-03-08',\n      inicio: '2027-03-09',\n    });\n  });\n\n  it('sem consulta: ciência tácita no 10º dia corrido contado do dia seguinte ao envio', () => {\n    expect(resumo(portal())).toMatchObject({ ciencia: '2027-03-11', inicio: '2027-03-12' });\n    // consulta depois do 10º dia não altera a ciência tácita\n    expect(resumo(portal({ dataDaConsulta: d('2027-03-15') })).ciencia).toBe('2027-03-11');\n  });\n\n  it('10º dia em dia não útil fica a confirmar (regra pendente com a curadoria)', () => {\n    const r = calcularPrazo(portal({ dataDeReferencia: d('2027-03-03') }));\n    expect(r).toMatchObject({ situacao: 'a-confirmar', motivo: 'sem-regra-legal' });\n  });\n\n  it('consulta anterior ao envio é dado inválido', () => {\n    const r = calcularPrazo(portal({ dataDaConsulta: d('2027-02-26') }));\n    expect(r).toMatchObject({ situacao: 'a-confirmar', motivo: 'dados-insuficientes' });\n  });\n\n  it('processo penal pelo portal não tem regra cadastrada', () => {\n    const r = calcularPrazo(penal({ meio: 'portal' }));\n    expect(r).toMatchObject({ situacao: 'a-confirmar', motivo: 'ramo-sem-regra' });\n  });\n});\n\ndescribe('ciência informada pelo advogado (meio manual)', () => {\n  it('cível: início no primeiro dia útil seguinte à ciência', () => {\n    expect(resumo(entrada({ meio: 'manual', dataDeReferencia: d('2027-03-05') }))).toEqual({\n      publicacao: undefined,\n      ciencia: '2027-03-05',\n      inicio: '2027-03-08',\n      vencimento: '2027-03-26',\n    });\n  });\n\n  it('penal: exclui só o dia do começo, em dias corridos (CPP, art. 798, §1º)', () => {\n    const e = penal({ meio: 'manual', dataDeReferencia: d('2027-03-05') });\n    expect(resumo(e)).toMatchObject({\n      ciencia: '2027-03-05',\n      inicio: '2027-03-06',\n      vencimento: '2027-03-10',\n    });\n  });\n});\n\ndescribe('RN06 · prazo em dobro conforme a tabela', () => {\n  const vencimento = (e: EntradaDoCalculo) => iso(calculado(e).vencimento);\n  const simples = '2027-03-23';\n  const dobrado = '2027-04-13';\n\n  it.each([\n    ['fazenda-publica', 'CPC, art. 183'],\n    ['ministerio-publico', 'CPC, art. 180'],\n    ['defensoria', 'CPC, art. 186'],\n  ] as const)('entes do CPC: %s dobra', (ente, fundamento) => {\n    const r = calculado(entrada({ condicoes: { ente } }));\n    expect(iso(r.vencimento)).toBe(dobrado);\n    expect(r.fundamentos).toContain(fundamento);\n  });\n\n  it('litisconsortes com procuradores distintos só dobram em autos físicos (CPC, art. 229, §2º)', () => {\n    const litis = { litisconsortesComProcuradoresDistintos: true };\n    expect(vencimento(entrada({ condicoes: { ...litis, autosFisicos: true } }))).toBe(dobrado);\n    expect(vencimento(entrada({ condicoes: litis }))).toBe(simples);\n  });\n\n  it('prazo próprio do ente não dobra', () => {\n    const e = entrada({\n      prazo: prazo({ dobro: 'nao-dobra' }),\n      condicoes: { ente: 'fazenda-publica' },\n    });\n    expect(vencimento(e)).toBe(simples);\n  });\n\n  it('penal: só a Defensoria dobra (LC 80/1994)', () => {\n    const dez = prazo({ quantidade: 10, contagem: 'corridos', dobro: 'so-defensoria' });\n    expect(vencimento(penal({ prazo: dez, condicoes: { ente: 'ministerio-publico' } }))).toBe(\n      '2027-03-12',\n    );\n    const r = calculado(penal({ prazo: dez, condicoes: { ente: 'defensoria' } }));\n    expect(iso(r.vencimento)).toBe('2027-03-22');\n    expect(r.fundamentos).toContain('LC 80/1994, arts. 44, I, 89, I, e 128, I');\n  });\n\n  it('trabalhista: Fazenda dobra para recorrer; os demais entes não', () => {\n    const recurso = prazo({ quantidade: 8, dobro: 'fazenda-para-recorrer' });\n    const r = calculado(\n      entrada({ ramo: 'trabalhista', prazo: recurso, condicoes: { ente: 'fazenda-publica' } }),\n    );\n    expect(iso(r.vencimento)).toBe('2027-03-24');\n    expect(r.fundamentos).toContain('Decreto-Lei 779/1969, art. 1º, III');\n    expect(\n      vencimento(\n        entrada({ ramo: 'trabalhista', prazo: recurso, condicoes: { ente: 'ministerio-publico' } }),\n      ),\n    ).toBe('2027-03-12');\n  });\n\n  it('\"verificar caso a caso\": sugere o simples e mostra o dobro como alternativa', () => {\n    const verificar = prazo({ quantidade: 8, dobro: 'verificar' });\n    const r = calculado(\n      entrada({ ramo: 'trabalhista', prazo: verificar, condicoes: { ente: 'fazenda-publica' } }),\n    );\n    expect(iso(r.vencimento)).toBe('2027-03-12');\n    expect(r.alternativas.map((a) => [iso(a.vencimento), a.descricao])).toEqual([\n      ['2027-03-24', 'prazo em dobro para o ente (tabela: verificar caso a caso)'],\n    ]);\n    expect(calculado(entrada({ ramo: 'trabalhista', prazo: verificar })).alternativas).toEqual([]);\n  });\n});\n\ndescribe('propriedades', () => {\n  const datas = fc.integer({ min: 0, max: 3000 }).map((n) => d('2023-01-02').maisDias(n));\n\n  it('a data sugerida nunca é mais tardia que uma alternativa', () => {\n    fc.assert(\n      fc.property(datas, fc.integer({ min: 1, max: 30 }), (data, quantidade) => {\n        const r = calcularPrazo(\n          penal({\n            dataDeReferencia: data,\n            prazo: prazo({ quantidade, contagem: 'corridos', dobro: 'so-defensoria' }),\n          }),\n        );\n        if (r.situacao !== 'calculado') return;\n        for (const alternativa of r.alternativas) {\n          expect(alternativa.vencimento.ehAntesDe(r.vencimento)).toBe(false);\n        }\n      }),\n    );\n  });\n\n  it('cível: o vencimento cai em dia útil e depois da publicação', () => {\n    fc.assert(\n      fc.property(datas, fc.integer({ min: 1, max: 30 }), (data, quantidade) => {\n        const r = calculado(entrada({ dataDeReferencia: data, prazo: prazo({ quantidade }) }));\n        expect([0, 6]).not.toContain(r.vencimento.diaDaSemana());\n        expect(r.vencimento.ehDepoisDe(r.publicacao ?? data)).toBe(true);\n      }),\n    );\n  });\n});\n\ndescribe('casos de borda (achados pelo teste de mutação)', () => {\n  it('texto do aviso de feriado local é o aprovado pela curadoria (V2, aba 8)', () => {\n    expect(AVISO_FERIADO_LOCAL).toBe(\n      'Feriado local não verificado — confira o calendário da comarca e a legislação aplicável antes de considerar o prazo definitivo.',\n    );\n    expect(AVISO_ALTERNATIVAS).toBe(\n      'Há outras datas possíveis: confira as alternativas e o fundamento de cada uma antes de confirmar.',\n    );\n  });\n\n  it('autos físicos sem litisconsortes com procuradores distintos não dobram', () => {\n    expect(iso(calculado(entrada({ condicoes: { autosFisicos: true } })).vencimento)).toBe(\n      '2027-03-23',\n    );\n  });\n\n  it('dobro decidido pela tabela não gera alternativa', () => {\n    for (const e of [\n      entrada({ condicoes: { ente: 'fazenda-publica' } }),\n      entrada({ prazo: prazo({ dobro: 'nao-dobra' }), condicoes: { ente: 'fazenda-publica' } }),\n      entrada({ condicoes: { litisconsortesComProcuradoresDistintos: true, autosFisicos: true } }),\n    ]) {\n      expect(calculado(e).alternativas).toEqual([]);\n    }\n  });\n\n  it('a alternativa do dobro cita o fundamento', () => {\n    const r = calculado(\n      entrada({\n        ramo: 'trabalhista',\n        prazo: prazo({ quantidade: 8, dobro: 'verificar' }),\n        condicoes: { ente: 'fazenda-publica' },\n      }),\n    );\n    expect(r.alternativas[0]?.fundamentos).toEqual(['CPC, art. 183, c/c CLT, art. 769']);\n  });\n\n  it('prorrogação no cível não gera alternativa', () => {\n    const calendario = calendarioDeOcorrencias([indisponibilidade('2027-03-23')]);\n    expect(calculado(entrada({ calendario })).alternativas).toEqual([]);\n  });\n\n  it('penal no DJEN cita a Lei 11.419/2006', () => {\n    expect(calculado(penal()).fundamentos[0]).toBe('Lei 11.419/2006, art. 4º, §§3º e 4º');\n  });\n\n  it('feriado ou suspensão no dia do início adia o início (cível e penal)', () => {\n    const feriadoNoInicio = calendarioDeOcorrencias([feriado('2027-03-03')]);\n    expect(resumo(entrada({ calendario: feriadoNoInicio })).inicio).toBe('2027-03-04');\n    const suspensaoNoInicio = calendarioDeOcorrencias([suspensao('2027-03-03')]);\n    expect(resumo(penal({ calendario: suspensaoNoInicio })).inicio).toBe('2027-03-04');\n    expect(resumo(penal({ calendario: feriadoNoInicio })).inicio).toBe('2027-03-04');\n  });\n\n  it('ciência manual no cível: indisponibilidade no dia seguinte adia o início', () => {\n    const calendario = calendarioDeOcorrencias([indisponibilidade('2027-03-02')]);\n    const r = calculado(entrada({ meio: 'manual', calendario }));\n    expect(iso(r.inicio)).toBe('2027-03-03');\n    expect(r.fundamentos[0]).toBe('CPC, art. 224, caput e §3º');\n  });\n\n  it('penal: sábado que também é feriado prorroga sem alternativa (CPP, art. 798, §3º)', () => {\n    const calendario = calendarioDeOcorrencias([feriado('2027-03-06')]);\n    const r = calculado(\n      penal({\n        calendario,\n        prazo: prazo({ quantidade: 4, contagem: 'corridos', dobro: 'so-defensoria' }),\n      }),\n    );\n    expect(iso(r.vencimento)).toBe('2027-03-08');\n    expect(r.alternativas).toEqual([]);\n    expect(r.fundamentos).toContain('CPP, art. 798, §3º');\n    expect(r.fundamentos).not.toContain('Lei 11.419/2006, art. 10, §2º');\n  });\n\n  it('penal: feriado no vencimento cita o CPP, não a Lei 11.419/2006', () => {\n    const calendario = calendarioDeOcorrencias([feriado('2027-03-05')]);\n    const r = calculado(\n      penal({\n        calendario,\n        prazo: prazo({ quantidade: 3, contagem: 'corridos', dobro: 'so-defensoria' }),\n      }),\n    );\n    expect(iso(r.vencimento)).toBe('2027-03-08');\n    expect(r.fundamentos).toContain('CPP, art. 798, §3º');\n    expect(r.fundamentos).not.toContain('Lei 11.419/2006, art. 10, §2º');\n  });\n\n  it('penal com vencimento exatamente em 20/12 mostra a alternativa com a suspensão', () => {\n    const r = calculado(penal({ dataDeReferencia: d('2027-12-14') }));\n    expect(iso(r.vencimento)).toBe('2027-12-20');\n    expect(r.alternativas.map((a) => iso(a.vencimento))).toEqual(['2028-01-21']);\n  });\n\n  it('a suspensão de fim de ano aparece na memória com o motivo', () => {\n    const r = calculado(entrada({ dataDeReferencia: d('2027-12-14') }));\n    expect(r.diasDesconsiderados.find((dia) => iso(dia.data) === '2027-12-20')?.motivo).toBe(\n      'suspensão de prazos de 20/12 a 20/01',\n    );\n  });\n\n  it('portal: dias até a ciência entram na memória', () => {\n    const naConsulta = calculado(entrada({ meio: 'portal', dataDaConsulta: d('2027-03-06') }));\n    expect(desconsiderados(naConsulta).slice(0, 2)).toEqual([\n      '2027-03-06 sábado',\n      '2027-03-07 domingo',\n    ]);\n    const tacita = calculado(entrada({ meio: 'portal' }));\n    expect(desconsiderados(tacita)[0]).toBe('2027-03-13 sábado');\n  });\n\n  it('\"a confirmar\" traz o detalhe e os fundamentos', () => {\n    expect(calcularPrazo(penal({ meio: 'portal' }))).toEqual({\n      situacao: 'a-confirmar',\n      motivo: 'ramo-sem-regra',\n      detalhe: 'ciência pelo portal no processo penal sem regra cadastrada',\n      fundamentos: ['CPC, art. 335'],\n    });\n    expect(\n      calcularPrazo(entrada({ meio: 'portal', dataDaConsulta: d('2027-02-26') })),\n    ).toMatchObject({\n      detalhe: 'consulta anterior ao envio da intimação',\n    });\n    expect(\n      calcularPrazo(entrada({ meio: 'portal', dataDeReferencia: d('2027-03-03') })),\n    ).toMatchObject({\n      detalhe: 'ciência tácita em dia não útil: regra pendente com a curadoria',\n    });\n    expect(calcularPrazo(entrada({ dataDeReferencia: d('2016-03-14') }))).toMatchObject({\n      detalhe: 'regra de contagem vigente em 2016-03-16 não cadastrada',\n    });\n    expect(calcularPrazo(entrada({ fusoDoJuizo: 'Fuso/Inexistente' }))).toEqual({\n      situacao: 'a-confirmar',\n      motivo: 'dados-insuficientes',\n      detalhe: 'fuso do juízo desconhecido: Fuso/Inexistente',\n      fundamentos: ['CPC, art. 213, parágrafo único'],\n    });\n    expect(calcularPrazo(entrada({ prazo: prazo({ contagem: 'corridos' }) }))).toEqual({\n      situacao: 'a-confirmar',\n      motivo: 'dados-insuficientes',\n      detalhe: 'a tabela conta em dias corridos e a regra do ramo em dias uteis',\n      fundamentos: ['CPC, art. 335', 'CPC, arts. 219 e 224'],\n    });\n    const tudoSuspenso = {\n      ocorrencias: () => [suspensao('2027-03-01')],\n      feriadosLocaisVerificados: true,\n    };\n    expect(calcularPrazo(entrada({ calendario: tudoSuspenso }))).toEqual({\n      situacao: 'a-confirmar',\n      motivo: 'calendario-esgotado',\n      detalhe: 'calendário sem dia útil a partir de 2027-03-03',\n      fundamentos: ['CPC, art. 335'],\n    });\n  });\n});\n"},"src/propriedades.test.ts":{"tests":[{"id":"67","name":"propriedades do motor com calendários aleatórios > início depois da referência e vencimento não antes do início","location":{"start":{"column":3,"line":79}}},{"id":"68","name":"propriedades do motor com calendários aleatórios > em dias úteis, o vencimento é dia útil, com expediente e sem suspensão nem indisponibilidade","location":{"start":{"column":3,"line":92}}},{"id":"69","name":"propriedades do motor com calendários aleatórios > em dias corridos, o vencimento sugerido nunca cai em domingo, feriado ou indisponibilidade","location":{"start":{"column":3,"line":106}}},{"id":"70","name":"propriedades do motor com calendários aleatórios > determinismo: a mesma entrada gera os mesmos bytes","location":{"start":{"column":3,"line":117}}},{"id":"71","name":"propriedades do motor com calendários aleatórios > o dobro nunca encurta o prazo","location":{"start":{"column":3,"line":125}}}],"source":"import { DiaDaSemana, LocalDate } from '@pz/kernel';\nimport fc from 'fast-check';\nimport { describe, expect, it } from 'vitest';\n\nimport { calendarioDeOcorrencias, EFEITOS, type OcorrenciaDatada } from './calendario.js';\nimport { serializarResultado } from './memoria.js';\nimport { calcularPrazo } from './regras.js';\n\nimport type { EntradaDoCalculo, Meio, Ramo } from './modelo.js';\n\n// Propriedades do motor sobre calendários ALEATÓRIOS (PZ-135): valem para qualquer combinação de\n// feriados, suspensões e indisponibilidades, não só para os casos assinados.\n\nconst base = LocalDate.de(2026, 1, 1);\nconst ocorrencia = fc\n  .record({ deslocamento: fc.integer({ min: 0, max: 500 }), efeito: fc.constantFrom(...EFEITOS) })\n  .map(({ deslocamento, efeito }): OcorrenciaDatada => ({\n    data: base.maisDias(deslocamento),\n    efeito,\n    motivo: `${efeito} aleatório`,\n    atoNormativo: 'ato fictício',\n    urlAto: 'https://exemplo.invalid/ato',\n  }));\nconst ramoEContagem = fc.constantFrom<"+"readonly [Ramo, 'uteis' | 'corridos']>(\n  ['civel', 'uteis'],\n  ['juizados', 'uteis'],\n  ['trabalhista', 'uteis'],\n  ['penal', 'corridos'],\n  ['juizado-criminal', 'corridos'],\n);\nconst entrada = fc\n  .record({\n    ramoEContagem,\n    meio: fc.constantFrom<"+"Meio>('djen', 'portal', 'manual'),\n    deslocamento: fc.integer({ min: 0, max: 400 }),\n    consulta: fc.option(fc.integer({ min: 0, max: 12 }), { nil: undefined }),\n    quantidade: fc.integer({ min: 1, max: 30 }),\n    ocorrencias: fc.array(ocorrencia, { maxLength: 40 }),\n    ente: fc.option(\n      fc.constantFrom('fazenda-publica', 'ministerio-publico', 'defensoria' as const),\n      {\n        nil: undefined,\n      },\n    ),\n  })\n  .map(\n    ({\n      ramoEContagem: [ramo, contagem],\n      meio,\n      deslocamento,\n      consulta,\n      quantidade,\n      ocorrencias,\n      ente,\n    }) => {\n      const dataDeReferencia = base.maisDias(deslocamento);\n      const e: EntradaDoCalculo = {\n        ramo,\n        meio,\n        dataDeReferencia,\n        ...(consulta === undefined ? {} : { dataDaConsulta: dataDeReferencia.maisDias(consulta) }),\n        prazo: {\n          quantidade,\n          unidade: 'dias',\n          contagem,\n          fundamento: 'fundamento fictício',\n          versao: 'v',\n          dobro: contagem === 'uteis' ? 'entes-cpc' : 'so-defensoria',\n        },\n        condicoes: ente === undefined ? {} : { ente },\n        fusoDoJuizo: 'America/Sao_Paulo',\n        calendario: calendarioDeOcorrencias(ocorrencias),\n      };\n      return { e, ocorrencias };\n    },\n  );\n\ndescribe('propriedades do motor com calendários aleatórios', () => {\n  it('início depois da referência e vencimento não antes do início', () => {\n    fc.assert(\n      fc.property(entrada, ({ e }) => {\n        const r = calcularPrazo(e);\n        if (r.situacao !== 'calculado') return;\n        expect(r.inicio.ehDepoisDe(e.dataDeReferencia)).toBe(true);\n        expect(r.vencimento.ehAntesDe(r.inicio)).toBe(false);\n        for (const alternativa of r.alternativas)\n          expect(alternativa.vencimento.ehDepoisDe(r.vencimento)).toBe(true);\n      }),\n    );\n  });\n\n  it('em dias úteis, o vencimento é dia útil, com expediente e sem suspensão nem indisponibilidade', () => {\n    fc.assert(\n      fc.property(entrada, ({ e, ocorrencias }) => {\n        const r = calcularPrazo(e);\n        if (r.situacao !== 'calculado' || e.prazo?.contagem !== 'uteis') return;\n        const semana = r.vencimento.diaDaSemana();\n        expect([DiaDaSemana.sabado, DiaDaSemana.domingo]).not.toContain(semana);\n        expect(ocorrencias.some((o) => o.data.igual(r.vencimento))).toBe(false);\n        const { mes, dia } = r.vencimento;\n        expect((mes === 12 && dia >= 20) || (mes === 1 && dia <"+"= 20)).toBe(false);\n      }),\n    );\n  });\n\n  it('em dias corridos, o vencimento sugerido nunca cai em domingo, feriado ou indisponibilidade', () => {\n    fc.assert(\n      fc.property(entrada, ({ e, ocorrencias }) => {\n        const r = calcularPrazo(e);\n        if (r.situacao !== 'calculado' || e.prazo?.contagem !== 'corridos') return;\n        expect(r.vencimento.diaDaSemana()).not.toBe(DiaDaSemana.domingo);\n        expect(ocorrencias.some((o) => o.data.igual(r.vencimento))).toBe(false);\n      }),\n    );\n  });\n\n  it('determinismo: a mesma entrada gera os mesmos bytes', () => {\n    fc.assert(\n      fc.property(entrada, ({ e }) => {\n        expect(serializarResultado(calcularPrazo(e))).toBe(serializarResultado(calcularPrazo(e)));\n      }),\n    );\n  });\n\n  it('o dobro nunca encurta o prazo', () => {\n    fc.assert(\n      fc.property(entrada, ({ e }) => {\n        const { ente: _ente, ...semEnte } = e.condicoes;\n        const simples = calcularPrazo({ ...e, condicoes: semEnte });\n        const comEnte = calcularPrazo(e);\n        if (simples.situacao !== 'calculado' || comEnte.situacao !== 'calculado') return;\n        expect(comEnte.vencimento.ehAntesDe(simples.vencimento)).toBe(false);\n      }),\n    );\n  });\n});\n"},"src/memoria.test.ts":{"tests":[{"id":"72","name":"fim do prazo no fuso do juízo (CPC, art. 213, parágrafo único; ADR-013) > termina às 24h do vencimento no horário do juízo","location":{"start":{"column":3,"line":48}}},{"id":"73","name":"fim do prazo no fuso do juízo (CPC, art. 213, parágrafo único; ADR-013) > fuso desconhecido fica a confirmar","location":{"start":{"column":3,"line":60}}},{"id":"74","name":"avisos ao advogado > feriados locais não verificados, alternativas e alerta da tabela, nesta ordem","location":{"start":{"column":3,"line":69}}},{"id":"75","name":"avisos ao advogado > sem nada a conferir, não há aviso","location":{"start":{"column":3,"line":94}}},{"id":"76","name":"serialização estável (gravar no prazo e comparar em recálculos) > mesma entrada, mesma saída byte a byte","location":{"start":{"column":3,"line":102}}},{"id":"77","name":"serialização estável (gravar no prazo e comparar em recálculos) > chaves em ordem alfabética, datas em ISO e sem campos ausentes","location":{"start":{"column":3,"line":108}}},{"id":"78","name":"serialização estável (gravar no prazo e comparar em recálculos) > não depende da ordem em que os campos foram montados","location":{"start":{"column":3,"line":130}}},{"id":"79","name":"serialização estável (gravar no prazo e comparar em recálculos) > propriedade: recalcular nunca muda a serialização","location":{"start":{"column":3,"line":136}}},{"id":"80","name":"memória de cálculo em português > calculado: datas, dias desconsiderados, fundamentos e versões","location":{"start":{"column":3,"line":160}}},{"id":"81","name":"memória de cálculo em português > ciência, fuso diferente, alternativas e avisos","location":{"start":{"column":3,"line":180}}},{"id":"82","name":"memória de cálculo em português > a confirmar: o motivo e os fundamentos, sem data","location":{"start":{"column":3,"line":210}}}],"source":"import { LocalDate } from '@pz/kernel';\nimport fc from 'fast-check';\nimport { describe, expect, it } from 'vitest';\n\nimport { calendarioDeOcorrencias } from './calendario.js';\nimport { formatarMemoria, serializarResultado } from './memoria.js';\nimport { AVISO_ALTERNATIVAS, AVISO_FERIADO_LOCAL, calcularPrazo } from './regras.js';\n\nimport type { EntradaDoCalculo, PrazoDaTabela } from './modelo.js';\n\n// Calendário FICTÍCIO (01/03/2027 é segunda-feira); datas reais assinadas ficam no PZ-135.\nconst d = (iso: string) => {\n  const r = LocalDate.analisar(iso);\n  if (!r.ok) throw r.erro;\n  return r.valor;\n};\nconst contestacao: PrazoDaTabela = {\n  quantidade: 15,\n  unidade: 'dias',\n  contagem: 'uteis',\n  fundamento: 'CPC, art. 335',\n  versao: 'tabela-teste-1',\n  dobro: 'entes-cpc',\n};\nconst entrada = (extra: Partial<"+"EntradaDoCalculo> = {}): EntradaDoCalculo => ({\n  ramo: 'civel',\n  meio: 'djen',\n  dataDeReferencia: d('2027-03-05'),\n  prazo: contestacao,\n  condicoes: {},\n  fusoDoJuizo: 'America/Sao_Paulo',\n  calendario: calendarioDeOcorrencias(\n    [\n      {\n        data: d('2027-03-10'),\n        efeito: 'sem-expediente',\n        motivo: 'feriado fictício',\n        atoNormativo: 'Lei fictícia 1/2000, art. 1º',\n        urlAto: 'https://exemplo.invalid/lei-1',\n      },\n    ],\n    { feriadosLocaisVerificados: true },\n  ),\n  ...extra,\n});\n\ndescribe('fim do prazo no fuso do juízo (CPC, art. 213, parágrafo único; ADR-013)', () => {\n  it('termina às 24h do vencimento no horário do juízo', () => {\n    const r = calcularPrazo(entrada({ fusoDoJuizo: 'America/Manaus' }));\n    if (r.situacao !== 'calculado') throw new Error(r.detalhe);\n    expect(r.vencimento.paraIso()).toBe('2027-03-30');\n    // 24h de 30/03 em Manaus (UTC-4) = 04h UTC de 31/03 = 01h de 31/03 em Brasília.\n    expect(r.fimDoPrazo.paraIso()).toBe('2027-03-31T04:00:00.000Z');\n    expect(r.fusoDoJuizo).toBe('America/Manaus');\n    expect(r.avisos).toEqual([\n      'O prazo termina às 24h no horário do juízo (America/Manaus), diferente do horário de Brasília.',\n    ]);\n  });\n\n  it('fuso desconhecido fica a confirmar', () => {\n    expect(calcularPrazo(entrada({ fusoDoJuizo: 'Fuso/Inexistente' }))).toMatchObject({\n      situacao: 'a-confirmar',\n      motivo: 'dados-insuficientes',\n    });\n  });\n});\n\ndescribe('avisos ao advogado', () => {\n  it('feriados locais não verificados, alternativas e alerta da tabela, nesta ordem', () => {\n    const r = calcularPrazo(\n      entrada({\n        ramo: 'trabalhista',\n        prazo: {\n          quantidade: 8,\n          unidade: 'dias',\n          contagem: 'uteis',\n          fundamento: 'CLT, art. 900',\n          versao: 'tabela-teste-1',\n          dobro: 'verificar',\n          alerta: 'Conferir se o ente tem prazo próprio.',\n        },\n        condicoes: { ente: 'fazenda-publica' },\n        calendario: calendarioDeOcorrencias([]),\n      }),\n    );\n    if (r.situacao !== 'calculado') throw new Error(r.detalhe);\n    expect(r.avisos).toEqual([\n      AVISO_FERIADO_LOCAL,\n      AVISO_ALTERNATIVAS,\n      'Conferir se o ente tem prazo próprio.',\n    ]);\n  });\n\n  it('sem nada a conferir, não há aviso', () => {\n    const r = calcularPrazo(entrada());\n    if (r.situacao !== 'calculado') throw new Error(r.detalhe);\n    expect(r.avisos).toEqual([]);\n  });\n});\n\ndescribe('serialização estável (gravar no prazo e comparar em recálculos)', () => {\n  it('mesma entrada, mesma saída byte a byte', () => {\n    expect(serializarResultado(calcularPrazo(entrada()))).toBe(\n      serializarResultado(calcularPrazo(entrada())),\n    );\n  });\n\n  it('chaves em ordem alfabética, datas em ISO e sem campos ausentes', () => {\n    const json = serializarResultado(calcularPrazo(entrada()));\n    const objeto = JSON.parse(json) as Record<"+"string, unknown>;\n    expect(Object.keys(objeto)).toEqual([...Object.keys(objeto)].sort());\n    expect(objeto).toMatchObject({\n      situacao: 'calculado',\n      publicacao: '2027-03-08',\n      inicio: '2027-03-09',\n      vencimento: '2027-03-30',\n      fimDoPrazo: '2027-03-31T03:00:00.000Z',\n    });\n    expect(objeto).not.toHaveProperty('ciencia');\n    expect(objeto.fundamentos).toEqual([\n      'Lei 11.419/2006, art. 4º, §§3º e 4º',\n      'CPC, art. 224, §§2º e 3º',\n      'CPC, arts. 219 e 224',\n      'CPC, art. 335',\n    ]);\n    // compacto: sem indentação nem quebra de linha\n    expect(json).toBe(JSON.stringify(objeto));\n  });\n\n  it('não depende da ordem em que os campos foram montados', () => {\n    const r = calcularPrazo(entrada());\n    const invertido = Object.fromEntries(Object.entries(r).reverse()) as typeof r;\n    expect(serializarResultado(invertido)).toBe(serializarResultado(r));\n  });\n\n  it('propriedade: recalcular nunca muda a serialização', () => {\n    fc.assert(\n      fc.property(fc.integer({ min: 0, max: 2000 }), fc.integer({ min: 1, max: 60 }), (n, q) => {\n        const e = (): EntradaDoCalculo =>\n          entrada({\n            dataDeReferencia: d('2024-01-01').maisDias(n),\n            prazo: {\n              quantidade: q,\n              unidade: 'dias',\n              contagem: 'uteis',\n              fundamento: 'CPC, art. 335',\n              versao: 'tabela-teste-1',\n              dobro: 'entes-cpc',\n            },\n          });\n        expect(serializarResultado(calcularPrazo(e()))).toBe(\n          serializarResultado(calcularPrazo(e())),\n        );\n      }),\n    );\n  });\n});\n\ndescribe('memória de cálculo em português', () => {\n  it('calculado: datas, dias desconsiderados, fundamentos e versões', () => {\n    expect(formatarMemoria(calcularPrazo(entrada()))).toEqual([\n      'Publicação considerada: 08/03/2027',\n      'Início da contagem: 09/03/2027',\n      'Vencimento sugerido: 30/03/2027, até as 24h no horário do juízo (America/Sao_Paulo)',\n      'Dias desconsiderados:',\n      '- 06/03/2027: sábado (CPC, art. 216)',\n      '- 07/03/2027: domingo (CPC, art. 216)',\n      '- 10/03/2027: feriado fictício (CPC, art. 216; Lei fictícia 1/2000, art. 1º)',\n      '- 13/03/2027: sábado (CPC, art. 216)',\n      '- 14/03/2027: domingo (CPC, art. 216)',\n      '- 20/03/2027: sábado (CPC, art. 216)',\n      '- 21/03/2027: domingo (CPC, art. 216)',\n      '- 27/03/2027: sábado (CPC, art. 216)',\n      '- 28/03/2027: domingo (CPC, art. 216)',\n      'Fundamentos: Lei 11.419/2006, art. 4º, §§3º e 4º; CPC, art. 224, §§2º e 3º; CPC, arts. 219 e 224; CPC, art. 335',\n      'Motor 1.1.0 · tabela tabela-teste-1',\n    ]);\n  });\n\n  it('ciência, fuso diferente, alternativas e avisos', () => {\n    const r = calcularPrazo(\n      entrada({\n        ramo: 'penal',\n        meio: 'manual',\n        dataDeReferencia: d('2027-03-01'),\n        fusoDoJuizo: 'America/Manaus',\n        prazo: {\n          quantidade: 5,\n          unidade: 'dias',\n          contagem: 'corridos',\n          fundamento: 'CPP, art. 593',\n          versao: 'tabela-teste-1',\n          dobro: 'so-defensoria',\n        },\n      }),\n    );\n    expect(formatarMemoria(r)).toEqual([\n      'Ciência: 01/03/2027',\n      'Início da contagem: 02/03/2027',\n      'Vencimento sugerido: 06/03/2027, até as 24h no horário do juízo (America/Manaus); em Brasília, 01h00 de 07/03/2027',\n      'Fundamentos: CPP, art. 798, caput e §1º; CPP, art. 593',\n      'Outras datas possíveis:',\n      '- 08/03/2027: prorrogação do vencimento no sábado para o próximo dia útil (CPP, art. 798, §3º)',\n      'Atenção: O prazo termina às 24h no horário do juízo (America/Manaus), diferente do horário de Brasília.',\n      `Atenção: ${AVISO_ALTERNATIVAS}`,\n      'Motor 1.1.0 · tabela tabela-teste-1',\n    ]);\n  });\n\n  it('a confirmar: o motivo e os fundamentos, sem data', () => {\n    const { prazo: comPrazo, ...semPrazo } = entrada();\n    expect(comPrazo).toBeDefined();\n    expect(formatarMemoria(calcularPrazo(semPrazo))).toEqual([\n      'Prazo a confirmar: sem regra legal cadastrada para este ato',\n      'O advogado informa a data, que fica marcada como definida manualmente.',\n    ]);\n    expect(\n      formatarMemoria(calcularPrazo(entrada({ prazo: { ...contestacao, unidade: 'horas' } }))),\n    ).toEqual([\n      'Prazo a confirmar: prazo em horas sem regra de contagem cadastrada',\n      'Fundamentos: CPC, art. 335',\n      'O advogado informa a data, que fica marcada como definida manualmente.',\n    ]);\n  });\n});\n"},"src/dias.test.ts":{"tests":[{"id":"83","name":"calendário por lista de ocorrências > agrupa as ocorrências do mesmo dia e devolve vazio nos demais","location":{"start":{"column":3,"line":50}}},{"id":"84","name":"critério de dias úteis (CPC, art. 216) > não conta sábado nem domingo","location":{"start":{"column":3,"line":67}}},{"id":"85","name":"critério de dias úteis (CPC, art. 216) > dia sem expediente cita o CPC, art. 216 e o ato do calendário","location":{"start":{"column":3,"line":76}}},{"id":"86","name":"critério de dias úteis (CPC, art. 216) > só os efeitos pedidos tiram o dia da contagem","location":{"start":{"column":3,"line":88}}},{"id":"87","name":"critério de dias úteis (CPC, art. 216) > fim de semana com feriado registra os dois motivos","location":{"start":{"column":3,"line":106}}},{"id":"88","name":"critério de dias corridos > conta fim de semana e só exclui os efeitos pedidos","location":{"start":{"column":3,"line":115}}},{"id":"89","name":"contagem de dias > o início é o dia 1 quando conta","location":{"start":{"column":3,"line":129}}},{"id":"90","name":"contagem de dias > 5 dias úteis a partir de segunda pulam o feriado e o fim de semana","location":{"start":{"column":3,"line":136}}},{"id":"91","name":"contagem de dias > dias desconsiderados depois do vencimento não entram na memória","location":{"start":{"column":3,"line":146}}},{"id":"92","name":"contagem de dias > recusa quantidade 0","location":{"start":{"column":36,"line":152}}},{"id":"93","name":"contagem de dias > recusa quantidade -1","location":{"start":{"column":36,"line":152}}},{"id":"94","name":"contagem de dias > recusa quantidade 1.5","location":{"start":{"column":36,"line":152}}},{"id":"95","name":"contagem de dias > recusa quantidade NaN","location":{"start":{"column":36,"line":152}}},{"id":"96","name":"contagem de dias > calendário que nunca deixa contar vira erro, não laço infinito","location":{"start":{"column":3,"line":156}}},{"id":"97","name":"contagem de dias > conta exatamente até o limite de dias percorridos","location":{"start":{"column":3,"line":164}}},{"id":"98","name":"contagem de dias > próximo dia que conta é estritamente depois da data","location":{"start":{"column":3,"line":172}}},{"id":"99","name":"contagem de dias > este ou o próximo: mantém o dia que conta e prorroga o que não conta","location":{"start":{"column":3,"line":187}}},{"id":"100","name":"propriedades da contagem > o vencimento conta e há exatamente n dias contados no intervalo","location":{"start":{"column":3,"line":197}}},{"id":"101","name":"propriedades da contagem > sem eventos, n dias corridos terminam em início + n - 1","location":{"start":{"column":3,"line":219}}},{"id":"102","name":"propriedades da contagem > mais dias nunca vencem antes (monotonia)","location":{"start":{"column":3,"line":227}}}],"source":"import { LocalDate } from '@pz/kernel';\nimport fc from 'fast-check';\nimport { describe, expect, it } from 'vitest';\n\nimport { calendarioDeOcorrencias, type OcorrenciaDatada } from './calendario.js';\nimport {\n  contarDias,\n  esteOuProximoQueConta,\n  LIMITE_DE_DIAS,\n  proximoDiaQueConta,\n  semContar,\n  semContarFimDeSemanaE,\n} from './dias.js';\n\n// Calendário FICTÍCIO: testa a aritmética, não o direito. Os casos com datas reais e assinados\n// pela curadora entram na suíte do motor (PZ-135).\nconst d = (iso: string) => {\n  const r = LocalDate.analisar(iso);\n  if (!r.ok) throw r.erro;\n  return r.valor;\n};\nconst feriado = (iso: string): OcorrenciaDatada => ({\n  data: d(iso),\n  efeito: 'sem-expediente',\n  motivo: 'feriado fictício',\n  atoNormativo: 'Lei fictícia 1/2000, art. 1º',\n  urlAto: 'https://exemplo.invalid/lei-1',\n});\nconst suspensao = (iso: string): OcorrenciaDatada => ({\n  data: d(iso),\n  efeito: 'suspensao-de-prazos',\n  motivo: 'suspensão fictícia',\n  atoNormativo: 'Portaria fictícia 2/2027',\n  urlAto: 'https://exemplo.invalid/portaria-2',\n});\nconst indisponibilidade = (iso: string): OcorrenciaDatada => ({\n  data: d(iso),\n  efeito: 'indisponibilidade',\n  motivo: 'indisponibilidade fictícia',\n  atoNormativo: 'Certidão fictícia 3/2027',\n  urlAto: 'https://exemplo.invalid/certidao-3',\n});\nconst vazio = calendarioDeOcorrencias([]);\nconst valor = <"+"T>(r: { ok: true; valor: T } | { ok: false; erro: unknown }): T => {\n  if (!r.ok) throw new Error('esperava ok');\n  return r.valor;\n};\n\ndescribe('calendário por lista de ocorrências', () => {\n  it('agrupa as ocorrências do mesmo dia e devolve vazio nos demais', () => {\n    const calendario = calendarioDeOcorrencias([feriado('2027-03-03'), suspensao('2027-03-03')]);\n    expect(calendario.ocorrencias(d('2027-03-03')).map((o) => o.efeito)).toEqual([\n      'sem-expediente',\n      'suspensao-de-prazos',\n    ]);\n    expect(calendario.ocorrencias(d('2027-03-04'))).toEqual([]);\n  });\n});\n\ndescribe('critério de dias úteis (CPC, art. 216)', () => {\n  const calendario = calendarioDeOcorrencias([\n    feriado('2027-03-03'),\n    suspensao('2027-03-02'),\n    indisponibilidade('2027-03-04'),\n  ]);\n\n  it('não conta sábado nem domingo', () => {\n    const conta = semContarFimDeSemanaE(vazio, []);\n    expect(conta(d('2027-03-06'))).toEqual([\n      { data: d('2027-03-06'), motivo: 'sábado', fundamento: 'CPC, art. 216' },\n    ]);\n    expect(conta(d('2027-03-07'))[0]?.motivo).toBe('domingo');\n    expect(conta(d('2027-03-05'))).toEqual([]);\n  });\n\n  it('dia sem expediente cita o CPC, art. 216 e o ato do calendário', () => {\n    const conta = semContarFimDeSemanaE(calendario, ['sem-expediente']);\n    expect(conta(d('2027-03-03'))).toEqual([\n      {\n        data: d('2027-03-03'),\n        motivo: 'feriado fictício',\n        fundamento: 'CPC, art. 216; Lei fictícia 1/2000, art. 1º',\n        urlAto: 'https://exemplo.invalid/lei-1',\n      },\n    ]);\n  });\n\n  it('só os efeitos pedidos tiram o dia da contagem', () => {\n    const soFeriados = semContarFimDeSemanaE(calendario, ['sem-expediente']);\n    expect(soFeriados(d('2027-03-02'))).toEqual([]);\n    expect(soFeriados(d('2027-03-04'))).toEqual([]);\n    const comSuspensao = semContarFimDeSemanaE(calendario, [\n      'sem-expediente',\n      'suspensao-de-prazos',\n    ]);\n    expect(comSuspensao(d('2027-03-02'))).toEqual([\n      {\n        data: d('2027-03-02'),\n        motivo: 'suspensão fictícia',\n        fundamento: 'Portaria fictícia 2/2027',\n        urlAto: 'https://exemplo.invalid/portaria-2',\n      },\n    ]);\n  });\n\n  it('fim de semana com feriado registra os dois motivos', () => {\n    const conta = semContarFimDeSemanaE(calendarioDeOcorrencias([feriado('2027-03-06')]), [\n      'sem-expediente',\n    ]);\n    expect(conta(d('2027-03-06')).map((m) => m.motivo)).toEqual(['sábado', 'feriado fictício']);\n  });\n});\n\ndescribe('critério de dias corridos', () => {\n  it('conta fim de semana e só exclui os efeitos pedidos', () => {\n    const calendario = calendarioDeOcorrencias([feriado('2027-03-03'), suspensao('2027-03-02')]);\n    const conta = semContar(calendario, ['suspensao-de-prazos']);\n    expect(conta(d('2027-03-06'))).toEqual([]);\n    expect(conta(d('2027-03-03'))).toEqual([]);\n    expect(conta(d('2027-03-02')).map((m) => m.motivo)).toEqual(['suspensão fictícia']);\n  });\n});\n\ndescribe('contagem de dias', () => {\n  const uteis = semContarFimDeSemanaE(calendarioDeOcorrencias([feriado('2027-03-03')]), [\n    'sem-expediente',\n  ]);\n\n  it('o início é o dia 1 quando conta', () => {\n    expect(valor(contarDias(d('2027-03-01'), 1, uteis))).toEqual({\n      data: d('2027-03-01'),\n      desconsiderados: [],\n    });\n  });\n\n  it('5 dias úteis a partir de segunda pulam o feriado e o fim de semana', () => {\n    const avanco = valor(contarDias(d('2027-03-01'), 5, uteis));\n    expect(avanco.data).toEqual(d('2027-03-08'));\n    expect(avanco.desconsiderados.map((m) => [m.data.paraIso(), m.motivo])).toEqual([\n      ['2027-03-03', 'feriado fictício'],\n      ['2027-03-06', 'sábado'],\n      ['2027-03-07', 'domingo'],\n    ]);\n  });\n\n  it('dias desconsiderados depois do vencimento não entram na memória', () => {\n    const avanco = valor(contarDias(d('2027-03-01'), 2, uteis));\n    expect(avanco.data).toEqual(d('2027-03-02'));\n    expect(avanco.desconsiderados).toEqual([]);\n  });\n\n  it.each([0, -1, 1.5, Number.NaN])('recusa quantidade %s', (quantidade) => {\n    expect(() => contarDias(d('2027-03-01'), quantidade, uteis)).toThrow(RangeError);\n  });\n\n  it('calendário que nunca deixa contar vira erro, não laço infinito', () => {\n    const nada = () => [{ data: d('2027-03-01'), motivo: 'x', fundamento: 'y' }];\n    expect(contarDias(d('2027-03-01'), 1, nada)).toEqual({\n      ok: false,\n      erro: { tipo: 'calendario-esgotado', aPartirDe: d('2027-03-01') },\n    });\n  });\n\n  it('conta exatamente até o limite de dias percorridos', () => {\n    const corridos = semContar(vazio, []);\n    expect(valor(contarDias(d('2027-03-01'), LIMITE_DE_DIAS, corridos)).data).toEqual(\n      d('2027-03-01').maisDias(LIMITE_DE_DIAS - 1),\n    );\n    expect(contarDias(d('2027-03-01'), LIMITE_DE_DIAS + 1, corridos).ok).toBe(false);\n  });\n\n  it('próximo dia que conta é estritamente depois da data', () => {\n    expect(valor(proximoDiaQueConta(d('2027-03-02'), uteis))).toEqual({\n      data: d('2027-03-04'),\n      desconsiderados: [\n        {\n          data: d('2027-03-03'),\n          motivo: 'feriado fictício',\n          fundamento: 'CPC, art. 216; Lei fictícia 1/2000, art. 1º',\n          urlAto: 'https://exemplo.invalid/lei-1',\n        },\n      ],\n    });\n    expect(valor(proximoDiaQueConta(d('2027-03-01'), uteis)).data).toEqual(d('2027-03-02'));\n  });\n\n  it('este ou o próximo: mantém o dia que conta e prorroga o que não conta', () => {\n    expect(valor(esteOuProximoQueConta(d('2027-03-05'), uteis)).data).toEqual(d('2027-03-05'));\n    expect(valor(esteOuProximoQueConta(d('2027-03-06'), uteis)).data).toEqual(d('2027-03-08'));\n  });\n});\n\ndescribe('propriedades da contagem', () => {\n  const inicio = fc.integer({ min: 0, max: 3650 }).map((n) => d('2026-01-01').maisDias(n));\n  const feriados = fc.uniqueArray(fc.integer({ min: 0, max: 400 }), { maxLength: 40 });\n\n  it('o vencimento conta e há exatamente n dias contados no intervalo', () => {\n    fc.assert(\n      fc.property(inicio, fc.integer({ min: 1, max: 60 }), feriados, (ini, n, deslocamentos) => {\n        const calendario = calendarioDeOcorrencias(\n          deslocamentos.map((k) => feriado(ini.maisDias(k).paraIso())),\n        );\n        const conta = semContarFimDeSemanaE(calendario, ['sem-expediente']);\n        const { data, desconsiderados } = valor(contarDias(ini, n, conta));\n        expect(conta(data)).toEqual([]);\n        let contados = 0;\n        const pulados: string[] = [];\n        for (let dia = ini; !dia.ehDepoisDe(data); dia = dia.maisDias(1)) {\n          if (conta(dia).length === 0) contados++;\n          else pulados.push(dia.paraIso());\n        }\n        expect(contados).toBe(n);\n        expect([...new Set(desconsiderados.map((m) => m.data.paraIso()))]).toEqual(pulados);\n      }),\n      { numRuns: 300 },\n    );\n  });\n\n  it('sem eventos, n dias corridos terminam em início + n - 1', () => {\n    fc.assert(\n      fc.property(inicio, fc.integer({ min: 1, max: 400 }), (ini, n) => {\n        expect(valor(contarDias(ini, n, semContar(vazio, []))).data).toEqual(ini.maisDias(n - 1));\n      }),\n    );\n  });\n\n  it('mais dias nunca vencem antes (monotonia)', () => {\n    fc.assert(\n      fc.property(inicio, fc.integer({ min: 1, max: 59 }), feriados, (ini, n, deslocamentos) => {\n        const calendario = calendarioDeOcorrencias(\n          deslocamentos.map((k) => feriado(ini.maisDias(k).paraIso())),\n        );\n        const conta = semContarFimDeSemanaE(calendario, ['sem-expediente']);\n        const antes = valor(contarDias(ini, n, conta)).data;\n        const depois = valor(contarDias(ini, n + 1, conta)).data;\n        expect(depois.ehDepoisDe(antes)).toBe(true);\n      }),\n      { numRuns: 200 },\n    );\n  });\n});\n"},"src/casos-curadoria.test.ts":{"tests":[{"id":"103","name":"fixture dos casos da curadoria > tem os 27 casos da aba 6, todos assinados","location":{"start":{"column":3,"line":90}}},{"id":"104","name":"casos assinados pela curadora (V2, aba 6) > CT01 · RN01 · Cível, DJEN, 15 dias úteis, semana sem feriado","location":{"start":{"column":4,"line":105}}},{"id":"105","name":"casos assinados pela curadora (V2, aba 6) > CT02 · RN03 · Disponibilização numa sexta-feira","location":{"start":{"column":4,"line":105}}},{"id":"106","name":"casos assinados pela curadora (V2, aba 6) > CT03 · RN03 · Disponibilização na véspera de feriado nacional","location":{"start":{"column":4,"line":105}}},{"id":"107","name":"casos assinados pela curadora (V2, aba 6) > CT04 · RN04 · Portal com consulta antes de 10 dias","location":{"start":{"column":4,"line":105}}},{"id":"108","name":"casos assinados pela curadora (V2, aba 6) > CT05 · RN04 · Portal sem consulta (ciência tácita)","location":{"start":{"column":4,"line":105}}},{"id":"109","name":"casos assinados pela curadora (V2, aba 6) > CT06 · RN02 · Prazo que atravessa o recesso de 20/12 a 20/01","location":{"start":{"column":4,"line":105}}},{"id":"110","name":"casos assinados pela curadora (V2, aba 6) > CT07 · RN02 · Disponibilização durante a suspensão","location":{"start":{"column":4,"line":105}}},{"id":"111","name":"casos assinados pela curadora (V2, aba 6) > CT08 · RN02 · Trabalhista atravessando o recesso","location":{"start":{"column":4,"line":105}}},{"id":"112","name":"casos assinados pela curadora (V2, aba 6) > CT09 · RN05 · Feriado municipal só da comarca do processo","location":{"start":{"column":4,"line":105}}},{"id":"113","name":"casos assinados pela curadora (V2, aba 6) > CT10 · RN05 · Carnaval e Quarta-feira de Cinzas com ato do tribunal","location":{"start":{"column":4,"line":105}}},{"id":"114","name":"casos assinados pela curadora (V2, aba 6) > CT11 · RN05 · Semana Santa na Justiça Federal","location":{"start":{"column":4,"line":105}}},{"id":"115","name":"casos assinados pela curadora (V2, aba 6) > CT12 · RN05 · Corpus Christi","location":{"start":{"column":4,"line":105}}},{"id":"116","name":"casos assinados pela curadora (V2, aba 6) > CT13 · RN05 · Feriado que cai em fim de semana","location":{"start":{"column":4,"line":105}}},{"id":"117","name":"casos assinados pela curadora (V2, aba 6) > CT14 · RN05 · Feriados encadeados (feriado + ponte)","location":{"start":{"column":4,"line":105}}},{"id":"118","name":"casos assinados pela curadora (V2, aba 6) > CT15 · RN05 · Portaria de suspensão publicada depois da intimação (recálculo)","location":{"start":{"column":4,"line":105}}},{"id":"119","name":"casos assinados pela curadora (V2, aba 6) > CT16 · RN06 · Fazenda Pública, prazo em dobro","location":{"start":{"column":4,"line":105}}},{"id":"120","name":"casos assinados pela curadora (V2, aba 6) > CT17 · RN06 · Ente com prazo próprio fixado em lei (sem dobro)","location":{"start":{"column":4,"line":105}}},{"id":"121","name":"casos assinados pela curadora (V2, aba 6) > CT19 · RN07 · Juizado especial cível em dias úteis","location":{"start":{"column":4,"line":105}}},{"id":"122","name":"casos assinados pela curadora (V2, aba 6) > CT20 · RN07 · Penal em dias corridos terminando em domingo","location":{"start":{"column":4,"line":105}}},{"id":"123","name":"casos assinados pela curadora (V2, aba 6) > CT21 · RN07 · Penal em dias corridos terminando em feriado","location":{"start":{"column":4,"line":105}}},{"id":"124","name":"casos assinados pela curadora (V2, aba 6) > CT22 · RN08 · Vencimento em dia com indisponibilidade certificada","location":{"start":{"column":4,"line":105}}},{"id":"125","name":"casos assinados pela curadora (V2, aba 6) > CT23 · RN08 · Vencimento em dia com expediente encerrado antes do horário normal","location":{"start":{"column":4,"line":105}}},{"id":"126","name":"casos assinados pela curadora (V2, aba 6) > CT24 · Fim do prazo · Juízo em outro fuso","location":{"start":{"column":4,"line":105}}},{"id":"127","name":"casos assinados pela curadora (V2, aba 6) > CT25 · Ano bissexto · Prazo atravessando 29/02/2028","location":{"start":{"column":4,"line":105}}},{"id":"128","name":"casos assinados pela curadora (V2, aba 6) > CT27 · Prazo do ato · Publicação fixa prazo diferente da tabela (lei omissa: vale o do juiz)","location":{"start":{"column":4,"line":105}}},{"id":"129","name":"casos assinados pela curadora (V2, aba 6) > CT15: sem o comunicado de suspensão, o vencimento era 17/08/2026 (recálculo)","location":{"start":{"column":3,"line":133}}},{"id":"130","name":"divergências com a curadoria (pendentes) > CT18 · A curadora tratou a data informada como disponibilização; o motor trata como ciência. Definir o que o advogado informa no meio manual.","location":{"start":{"column":97,"line":149}}},{"id":"131","name":"divergências com a curadoria (pendentes) > CT26 · A regra dos juizados anterior à Lei 13.728/2018 (dias corridos) não está cadastrada.","location":{"start":{"column":97,"line":149}}}],"source":"import { readFileSync } from 'node:fs';\n\nimport { LocalDate } from '@pz/kernel';\nimport { describe, expect, it } from 'vitest';\n\nimport { calendarioDeOcorrencias, EFEITOS, type Efeito } from './calendario.js';\nimport { serializarResultado } from './memoria.js';\nimport { calcularPrazo } from './regras.js';\n\nimport type { EntradaDoCalculo, PoliticaDeDobro, Ramo, Meio, Ente } from './modelo.js';\n\n// Casos com datas reais assinados pela curadora (V2, aba 6). Fonte da verdade: a planilha em\n// docs/curadoria; a fixture é a transcrição versionada. Mudar um caso exige nova assinatura.\n\ninterface EntradaDoCaso {\n  readonly ramo: Ramo;\n  readonly meio: Meio;\n  readonly dataDeReferencia: string;\n  readonly dataDaConsulta?: string;\n  readonly fusoDoJuizo: string;\n  readonly prazo: {\n    readonly quantidade: number;\n    readonly contagem: 'uteis' | 'corridos';\n    readonly dobro: PoliticaDeDobro;\n    readonly fundamento: string;\n  };\n  readonly condicoes: {\n    readonly ente?: Ente;\n    readonly litisconsortesComProcuradoresDistintos?: boolean;\n    readonly autosFisicos?: boolean;\n  };\n}\ninterface DiaDoCalendario {\n  readonly data: string;\n  readonly efeito: Efeito;\n  readonly motivo: string;\n  readonly atoNormativo: string;\n}\ninterface Caso {\n  readonly id: string;\n  readonly regra: string;\n  readonly cenario: string;\n  readonly entrada: EntradaDoCaso;\n  readonly calendario: readonly DiaDoCalendario[];\n  readonly esperado: Readonly<"+"\n    Record<"+"'publicacao' | 'ciencia' | 'inicio' | 'vencimento' | 'fimDoPrazo', string>\n  >;\n  readonly assinatura: string;\n}\ninterface Divergencia {\n  readonly id: string;\n  readonly entrada: EntradaDoCaso;\n  readonly calendario: readonly DiaDoCalendario[];\n  readonly esperadoPelaCuradora: Readonly<"+"Record<"+"string, string>>;\n  readonly respostaDoMotor: Readonly<"+"Record<"+"string, string>>;\n  readonly pendencia: string;\n}\n\nconst fixture = JSON.parse(\n  readFileSync(new URL('../fixtures/casos-curadoria-v2.json', import.meta.url), 'utf8'),\n) as { readonly casos: readonly Caso[]; readonly divergencias: readonly Divergencia[] };\n\nconst d = (iso: string) => {\n  const r = LocalDate.analisar(iso);\n  if (!r.ok) throw r.erro;\n  return r.valor;\n};\n\nfunction entradaDo(caso: {\n  entrada: EntradaDoCaso;\n  calendario: readonly DiaDoCalendario[];\n}): EntradaDoCalculo {\n  const { entrada } = caso;\n  return {\n    ramo: entrada.ramo,\n    meio: entrada.meio,\n    dataDeReferencia: d(entrada.dataDeReferencia),\n    ...(entrada.dataDaConsulta === undefined ? {} : { dataDaConsulta: d(entrada.dataDaConsulta) }),\n    prazo: { ...entrada.prazo, unidade: 'dias', versao: 'curadoria-v2' },\n    condicoes: entrada.condicoes,\n    fusoDoJuizo: entrada.fusoDoJuizo,\n    calendario: calendarioDeOcorrencias(\n      caso.calendario.map((dia) => ({ ...dia, data: d(dia.data), urlAto: 'docs/curadoria' })),\n      { feriadosLocaisVerificados: true },\n    ),\n  };\n}\n\ndescribe('fixture dos casos da curadoria', () => {\n  it('tem os 27 casos da aba 6, todos assinados', () => {\n    const ids = [...fixture.casos, ...fixture.divergencias].map((caso) => caso.id).sort();\n    expect(ids).toEqual(\n      Array.from({ length: 27 }, (_, i) => `CT${String(i + 1).padStart(2, '0')}`),\n    );\n    for (const caso of fixture.casos)\n      expect(caso.assinatura).toMatch(/Monnalyza Sodré de Freitas .* 29\\/10\\/2026/);\n    for (const dia of fixture.casos.flatMap((caso) => caso.calendario))\n      expect(EFEITOS).toContain(dia.efeito);\n  });\n});\n\ndescribe('casos assinados pela curadora (V2, aba 6)', () => {\n  it.each(\n    fixture.casos.map((caso) => [`${caso.id} · ${caso.regra} · ${caso.cenario}`, caso] as const),\n  )('%s', (_nome, caso) => {\n    const r = calcularPrazo(entradaDo(caso));\n    if (r.situacao !== 'calculado') throw new Error(`${caso.id}: ${r.detalhe}`);\n    const obtido: Record<"+"string, string | undefined> = {\n      publicacao: r.publicacao?.paraIso(),\n      ciencia: r.ciencia?.paraIso(),\n      inicio: r.inicio.paraIso(),\n      vencimento: r.vencimento.paraIso(),\n      fimDoPrazo: r.fimDoPrazo.paraIso(),\n    };\n    for (const [campo, esperado] of Object.entries(caso.esperado))\n      expect(obtido[campo], campo).toBe(esperado);\n    // Em dias úteis, todo dia sem expediente ou suspenso que a curadora listou no período aparece\n    // na memória de cálculo; em dias corridos, só a suspensão tira o dia da contagem.\n    const naMemoria = new Set(r.diasDesconsiderados.map((dia) => dia.data.paraIso()));\n    for (const dia of caso.calendario) {\n      const relevante =\n        !d(dia.data).ehDepoisDe(r.vencimento) &&\n        !d(dia.data).ehAntesDe(r.publicacao ?? r.ciencia ?? r.inicio);\n      const desconta =\n        dia.efeito === 'suspensao-de-prazos' ||\n        (dia.efeito === 'sem-expediente' && caso.entrada.prazo.contagem === 'uteis');\n      if (relevante && desconta) expect(naMemoria.has(dia.data), dia.data).toBe(true);\n    }\n    // Determinismo: recalcular dá os mesmos bytes.\n    expect(serializarResultado(calcularPrazo(entradaDo(caso)))).toBe(serializarResultado(r));\n  });\n\n  it('CT15: sem o comunicado de suspensão, o vencimento era 17/08/2026 (recálculo)', () => {\n    const caso = fixture.casos.find((c) => c.id === 'CT15');\n    if (caso === undefined) throw new Error('CT15 ausente');\n    const antes = {\n      ...caso,\n      calendario: caso.calendario.filter((dia) => dia.efeito !== 'suspensao-de-prazos'),\n    };\n    const r = calcularPrazo(entradaDo(antes));\n    expect(r.situacao === 'calculado' && r.vencimento.paraIso()).toBe('2026-08-17');\n  });\n});\n\n// Casos em que a resposta do motor diverge da planilha por regra ainda não definida (card\n// \"Pendência · Curadoria V2 da HU14\"). O teste fixa a resposta atual: quando a curadora decidir,\n// o caso volta para a lista principal com a regra implementada.\ndescribe('divergências com a curadoria (pendentes)', () => {\n  it.each(fixture.divergencias.map((caso) => [`${caso.id} · ${caso.pendencia}`, caso] as const))(\n    '%s',\n    (_nome, caso) => {\n      const r = calcularPrazo(entradaDo(caso));\n      if (r.situacao === 'calculado') {\n        expect({\n          ciencia: r.ciencia?.paraIso(),\n          inicio: r.inicio.paraIso(),\n          vencimento: r.vencimento.paraIso(),\n        }).toEqual(caso.respostaDoMotor);\n        expect(r.vencimento.paraIso()).not.toBe(caso.esperadoPelaCuradora.vencimento);\n      } else {\n        expect({ situacao: r.situacao, motivo: r.motivo }).toEqual(caso.respostaDoMotor);\n      }\n    },\n  );\n});\n"},"src/modelo.test.ts":{"tests":[{"id":"132","name":"modelo de entrada e saída do motor > fixa os valores aceitos","location":{"start":{"column":3,"line":17}}}],"source":"import { describe, expect, it } from 'vitest';\n\nimport { EFEITOS } from './calendario.js';\n\nimport {\n  CONTAGENS,\n  ENTES,\n  MEIOS,\n  MOTIVOS_A_CONFIRMAR,\n  POLITICAS_DE_DOBRO,\n  RAMOS,\n  UNIDADES,\n} from './index.js';\n\n// Contrato do motor: mudar estes valores exige migrar os prazos gravados (ADR-007).\ndescribe('modelo de entrada e saída do motor', () => {\n  it('fixa os valores aceitos', () => {\n    expect(RAMOS).toEqual(['civel', 'juizados', 'trabalhista', 'penal', 'juizado-criminal']);\n    expect(MEIOS).toEqual(['djen', 'portal', 'manual']);\n    expect(UNIDADES).toEqual(['dias', 'horas', 'meses', 'anos']);\n    expect(CONTAGENS).toEqual(['uteis', 'corridos']);\n    expect(ENTES).toEqual(['fazenda-publica', 'ministerio-publico', 'defensoria']);\n    expect(POLITICAS_DE_DOBRO).toEqual([\n      'entes-cpc',\n      'so-defensoria',\n      'fazenda-para-recorrer',\n      'nao-dobra',\n      'verificar',\n    ]);\n    expect(EFEITOS).toEqual(['sem-expediente', 'suspensao-de-prazos', 'indisponibilidade']);\n    expect(MOTIVOS_A_CONFIRMAR).toEqual([\n      'sem-regra-legal',\n      'unidade-sem-regra',\n      'ramo-sem-regra',\n      'dados-insuficientes',\n      'calendario-esgotado',\n    ]);\n  });\n});\n"}},"projectRoot":"/Users/edsonjunior/PrejuZero/pz-controller/pz-controller/packages/motor-prazos","config":{"$schema":"../../node_modules/@stryker-mutator/core/schema/stryker-schema.json","plugins":["@stryker-mutator/vitest-runner"],"testRunner":"vitest","vitest":{"configFile":"vitest.config.ts","related":true,"pool":"threads"},"mutate":["src/**/*.ts","!src/**/*.test.ts"],"coverageAnalysis":"perTest","reporters":["clear-text","progress","html"],"htmlReporter":{"fileName":"reports/mutacao/index.html"},"thresholds":{"high":95,"low":90,"break":90},"tempDirName":".s
