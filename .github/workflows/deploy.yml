# Deploy contínuo para staging (HU02, ADR-010). Roda depois do CI verde na main.
# Desligado até existirem conta AWS, apps e a configuração abaixo (docs/runbooks/infraestrutura-aws.md):
#   variáveis do repositório: DEPLOY_HABILITADO=true, AWS_ROLE_DEPLOY, APPS_DEPLOY (ex.: ["api","worker"]),
#   URL_STAGING; segredo TF_BACKEND_STAGING (conteúdo do backend.hcl) e TF_VARS_STAGING (terraform.tfvars).
# Rollback: o ECS volta sozinho para a versão anterior se as novas tarefas não ficarem saudáveis
# (deployment circuit breaker com rollback, em infra/terraform/modulos/computacao).
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: sa-east-1

jobs:
  imagens:
    name: Construir e publicar imagens
    if: >-
      vars.DEPLOY_HABILITADO == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment: staging
    strategy:
      matrix:
        app: ${{ fromJSON(vars.APPS_DEPLOY || '[]') }}
    env:
      VERSAO: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSAO }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - name: Construir imagem
        env:
          IMAGEM: ${{ steps.ecr.outputs.registry }}/pz-staging/${{ matrix.app }}:${{ env.VERSAO }}
          APP: ${{ matrix.app }}
        run: |
          docker build -f infra/docker/node-app.Dockerfile \
            --platform linux/arm64 \
            --build-arg "APP=@pz/${APP}" \
            -t "${IMAGEM}" .
          echo "IMAGEM=${IMAGEM}" >> "$GITHUB_ENV"
      - name: Varrer imagem (Trivy) e publicar
        env:
          TRIVY_VERSION: 0.75.0
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          ./trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "${IMAGEM}"
          docker push "${IMAGEM}"

  implantar:
    name: Implantar em staging
    needs: imagens
    runs-on: ubuntu-latest
    environment: staging
    env:
      VERSAO: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.VERSAO }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_DEPLOY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Aplicar nova versão (Terraform)
        working-directory: infra/terraform/ambientes/staging
        env:
          TF_BACKEND: ${{ secrets.TF_BACKEND_STAGING }}
          TF_VARS: ${{ secrets.TF_VARS_STAGING }}
        run: |
          printf '%s\n' "${TF_BACKEND}" > backend.hcl
          printf '%s\n' "${TF_VARS}" > terraform.tfvars
          terraform init -input=false -backend-config=backend.hcl
          terraform apply -input=false -auto-approve -var "versao_imagem=${VERSAO}"
      - name: Aguardar estabilização (rollback automático se falhar)
        run: |
          servicos=$(aws ecs list-services --cluster pz-staging --query 'serviceArns' --output text)
          if [ -n "${servicos}" ]; then
            # shellcheck disable=SC2086
            aws ecs wait services-stable --cluster pz-staging --services ${servicos}
          fi
      - name: Smoke test
        env:
          URL_STAGING: ${{ vars.URL_STAGING }}
        run: curl -fsS --retry 10 --retry-delay 10 --retry-all-errors "${URL_STAGING}/health/ready"
