# Fumaça semanal contra a API real do DJEN (HU17). Não bloqueia merge: avisa se o formato ou a
# disponibilidade mudaram. Só faz uma consulta de saúde, sem OAB nem processo.
name: Fumaça DJEN

on:
  schedule:
    - cron: '0 12 * * 1' # segundas, 9h de Brasília
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fumaca:
    name: API real do DJEN
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter @pz/adapter-djen...
      - run: pnpm --filter @pz/adapter-djen fumaca
