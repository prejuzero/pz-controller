# Quality gates obrigatórios (CLAUDE.md, seção 13). Todos os jobs bloqueiam o merge.
# Actions fixadas pelo hash do commit (tag apenas em comentário) para evitar troca silenciosa de código.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  qualidade:
    name: Formatação, lint, fronteiras e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  testes:
    name: Testes unitários e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cobertura
          path: '**/coverage/'
          if-no-files-found: ignore

  integracao:
    name: Testes de integração (Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:int

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  commits:
    name: Padrão de commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  segredos:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Instalar gitleaks (com verificação de checksum)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          arquivo="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${base}/${arquivo}"
          curl -fsSLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " ${arquivo}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "${arquivo}" gitleaks
      - run: ./gitleaks git --redact --verbose --exit-code 1 .

  dependencias:
    name: Vulnerabilidades em dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  sast:
    name: Análise estática de segurança (Semgrep)
    runs-on: ubuntu-latest
    env:
      SEMGREP_VERSION: 1.179.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipx install "semgrep==${SEMGREP_VERSION}"
      - run: >-
          semgrep scan --error --metrics=off
          --config p/default --config p/owasp-top-ten --config p/secrets
          --exclude node_modules

  infra:
    name: Infraestrutura (Terraform, Trivy e hadolint)
    runs-on: ubuntu-latest
    env:
      TRIVY_VERSION: 0.75.0
      HADOLINT_VERSION: 2.15.1
      HADOLINT_SHA256: c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/terraform
      - name: Terraform validate (sem backend e sem credenciais)
        run: |
          for raiz in infra/terraform/ambientes/staging infra/terraform/ambientes/producao infra/terraform/bootstrap; do
            terraform -chdir="$raiz" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$raiz" validate
          done
      - name: Instalar Trivy e hadolint (com verificação de checksum)
        run: |
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLO "${base}/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz\$" "trivy_${TRIVY_VERSION}_checksums.txt" | sha256sum --check -
          tar -xzf "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" trivy
          curl -fsSLo hadolint "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-linux-x86_64"
          echo "${HADOLINT_SHA256}  hadolint" | sha256sum --check -
          chmod +x hadolint
      - name: Trivy (configuração de infraestrutura)
        run: ./trivy config --exit-code 1 --ignorefile .trivyignore.yaml infra/
      - name: hadolint (Dockerfiles)
        run: ./hadolint infra/docker/node-app.Dockerfile infra/docker/postgres/Dockerfile

  ambiente-local:
    name: Ambiente local (docker compose)
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f infra/docker/compose.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Subir infraestrutura e criar buckets
        run: |
          ${COMPOSE} up -d --build --wait
          ${COMPOSE} run --rm armazenamento-init
      - name: Verificar extensões do PostgreSQL
        run: |
          extensoes=$(${COMPOSE} exec -T postgres psql -U pz_dev -d prejuzero -tAc \
            "select string_agg(extname, ',' order by extname) from pg_extension")
          echo "extensões: ${extensoes}"
          for ext in pg_partman pg_trgm unaccent; do
            echo "${extensoes}" | tr ',' '\n' | grep -qx "${ext}"
          done
      - name: Verificar buckets e object lock (idempotência incluída)
        run: |
          ${COMPOSE} run --rm armazenamento-init
          ${COMPOSE} run --rm --entrypoint aws armazenamento-init \
            --endpoint-url http://armazenamento:9000 s3api get-object-lock-configuration --bucket pz-auditoria-worm
      - name: Verificar Redis e Mailpit
        run: |
          ${COMPOSE} exec -T redis redis-cli ping | grep -q PONG
          curl -fsS http://127.0.0.1:8025/readyz
      - name: Logs em caso de falha
        if: failure()
        run: ${COMPOSE} logs
      - name: Derrubar
        if: always()
        run: ${COMPOSE} --profile init down -v
