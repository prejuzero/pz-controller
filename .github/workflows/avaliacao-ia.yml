# Gate de qualidade da IA (HU22, CLAUDE.md seção 11): só roda quando muda o que afeta a
# classificação (prompt, modelo, configuração, taxonomia, regras, casos ou o próprio runner).
# Mudança de prompt sem gravação nova para os casos da meta, ou acerto abaixo de 98%, reprova.
name: Avaliação da IA

on:
  pull_request:
    paths:
      - 'eval/**'
      - 'packages/ia/**'
      - 'modules/classificacao/**'
      - 'packages/adapters/anthropic/**'
      - 'packages/integracoes/src/portas/provedor-ia.ts'
      - '.github/workflows/avaliacao-ia.yml'
  push:
    branches: [main]
    paths:
      - 'eval/**'
      - 'packages/ia/**'
      - 'modules/classificacao/**'
      - 'packages/adapters/anthropic/**'
      - 'packages/integracoes/src/portas/provedor-ia.ts'
      - '.github/workflows/avaliacao-ia.yml'

concurrency:
  group: avaliacao-ia-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: '1'

jobs:
  avaliacao-ia:
    name: Avaliação da IA (gate de 98%)
    runs-on: ubuntu-latest
    # Sem rede e sem chave da API: reproduz as respostas gravadas (eval/README.md).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm eval
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: avaliacao-ia
          path: eval/relatorio/
          if-no-files-found: error
